# 站点时区。必须设置，否则「今天发布的文章」当天不会上线：
# archetypes/ 写的是 date: {{ now.Format "2006-01-02" }}（只有日期，没有时刻），
# Hugo 把这种 date 按 UTC 零点解析；在东八区，它就成了「未来 8 小时」的页面，
# 而 Hugo 默认不构建未来日期的内容（buildFuture = false）——
# 于是当天新建并发布的文章会被 CI 静默跳过，直到次日 UTC 跨过该日期才出现。
# 实测：不设此项时 `hugo --minify --gc` 不产出当天日期的文章；设了就会有。
timeZone = 'Asia/Shanghai'

baseURL = 'https://skyrim86.github.io/my-blog/'
defaultContentLanguage = 'zh'
# 站点名。它同时是**导航栏品牌名、页脚版权、RSS channel 标题、og:site_name 与 JSON-LD 的 name**，
# 也是首页 <title> 的**唯一**来源 —— 主题 head.html 在首页直接忽略 .Title，
# profileMode.title/subtitle 也不参与任何 head 标签（见 themes/PaperMod/layouts/_partials/head.html:11）。
# 所以这一行既是品牌也是首页标题，改长会同时影响导航栏宽度（640~1024px 之间要回来看一眼是否挤）。
title = 'Skyrim 的学习笔记'
theme = 'PaperMod'
hasCJKLanguage = true

enableRobotsTXT = true
# 启用 Emoji 支持
enableEmoji = true

# 启用 Git 信息（显示文章最后修改时间）
enableGitInfo = true

[frontmatter]
  lastmod = ['lastmod', ':git', 'date']
  date = ['date', 'publishDate', 'lastmod']

[taxonomies]
  tag = 'tags'
  category = 'categories'
  # series 零个词条（没有任何内容页写 series），但**刻意保留**：
  #   · 空词条的 /series/ 只是个空列表页，除了进 sitemap 没有坏处；
  #   · 删掉 content/series/_index.md 才能让 /series/ 真正消失，而
  #     scripts/new-content.sh remove 的护栏拒绝删除 section 根目录（手敲 rm 违反 AGENTS 规则 1）；
  #   · 只删这一行、留下文件更糟：/series/ 会退化成普通空 section（页面照样在），
  #     而 `new-content.sh post --series X` 与管理页的「系列」输入框会变成**静默无效**的功能。
  # 所以要用连载功能就直接用；真要彻底移除，得连文件、CLI 选项与管理页字段一起清。
  #
  # 2026-09-18 决定：**保留**。它不产生任何可见副作用（空词条页只进 sitemap），
  # 而移除需要同时动 4 处（本行、content/series/_index.md、new-content.sh 的 --series、
  # 管理页的系列输入框），拆一半会比留着更危险 —— 那会让 CLI 与管理页出现静默无效的字段。
  # 所以这一项不是「忘了清理的开关」，是登记在册的保留项，别再当成待清理项。
  series = 'series'


# 语言配置
[languages]
  [languages.zh]
    locale = 'zh-CN'
    label = '中文'
    weight = 1
# 启用 RSS
[outputs]
  home = ['HTML', 'RSS', 'JSON', 'LLMS']  # JSON 用于搜索功能，LLMS 见下面的输出格式定义

# 站点索引（public/llms.txt）：给 AI 爬虫/摘要工具一份「本站有哪些页面」的清单。
# 模板是主题里那份递归版 themes/PaperMod/layouts/llms.txt —— 它一直在仓库里，但此前没有
# 对应的输出格式，所以从来没产出过文件（典型的「有实现没开关」）。
[outputFormats.LLMS]
  mediaType = 'text/plain'
  baseName = 'llms'
  isPlainText = true
  # 不写进 <head> 的 <link rel="alternate">：它是给机器读的站点清单，不是本页的替代表示。
  notAlternative = true

# 分页设置
[pagination]
pagerSize = 10

# 永久链接格式
[permalinks]
  [permalinks.page]
    posts = '/:year/:month/:slug/'
  [permalinks.section]
    posts = '/posts/'

# ============================================
# 核心参数配置
# ============================================
[params]
  # 主内容区：文章列表与上下篇导航只统计这些 section。
  # 不把 courses 放进来，避免课程章节混进文章列表与上下篇导航。
  #
  # **当前 posts 下有 0 篇文章**（只有 _index.md），所以凡是拿 mainSections 当判据的东西
  # 现在都是惰性的 —— 首页不渲染文章列表、ShowPostNavLinks 不产出任何 HTML。这是**预期状态**，
  # 不是坏配置：写进第一篇之后它们会自行生效，不用改这里。同类处置还有两处，口径一致：
  #   · “归档”页 2026-09-15 删除（posts 空时渲染出来是空页）—— 要恢复就把 content/archives.md 加回来；
  #   · 导航里的「文章」入口 2026-09-18 摘掉（点进去是空列表页）—— 写第一篇后按 weight = 40 加回来。
  mainSections = ['posts']

  # 启用 OG/twitter meta 的开关
  env = 'production'

  #站点介绍（首页 meta description，以及没写 description 的页面的兜底描述）
  description = 'Skyrim 的学习笔记：回归分析与数值分析课程笔记、数学建模项目记录，以及可检索的数学工具库'

  # 显示阅读时间
  ShowReadingTime = true

  # 显示文章目录
  ShowToc = true

  # 页内目录默认收起。宽屏时它本来就被左侧跟随目录栏顶替（12-toc-rail.css 的
  # body.has-toc-rail 那条规则把它 display:none），窄屏时它是唯一的目录 ——
  # 默认展开会在正文顶上占掉一大块。2026-09-18 之前这里是 true，注释却写着「默认折叠目录」。
  TocOpen = false

  # 页内目录改用 Hugo 的 .TableOfContents（h2–h3），不再用主题自建那套「正则扫 h1–h6 + plainify」：
  #   · 条目集合：自建那套会多收 h4（实测 lab 页 30 条 vs 左侧目录栏 15 条），两份目录对不上；
  #   · 文本：自建那套对含公式的小标题会 plainify 出乱码（实测「手算 ttt 检验时用」、
  #     「SSreg=β^12SxxSS_{\rm reg}=…」），.TableOfContents 给的是干净原文。
  # 左侧目录栏（layouts/_partials/toc-rail.html）本来就用 .TableOfContents，两者从此同源。
  # 注意：改这个会影响所有单页的页内目录，模板见 themes/PaperMod/layouts/_partials/toc.html。
  UseHugoToc = true

  # 显示面包屑导航
  ShowBreadCrumbs = true

  # 显示文章上下篇导航。
  # 判据是 themes/PaperMod/layouts/_partials/post_nav_links.html 第 1–2 行：
  # `where site.RegularPages "Type" "in" mainSections` 且页数 > 1。
  # mainSections 只有 posts、而 posts 下 0 篇，所以这个开关**目前在站上不产出任何 HTML**
  # （不是坏了，是还没有文章）。写进第一篇后自动生效，届时无需改动本行。
  ShowPostNavLinks = true
  # 显示代码复制按钮
  ShowCodeCopyButtons = true

  # 显示 RSS 订阅按钮
  ShowRssButtonInSectionTermList = true

  # 默认 Open Graph 图片（分享时显示）
  images = ['images/site-cover.jpg']

  # 日期格式
  DateFormat = '2006年1月2日'

  # 作者信息
  author = 'Skyrim'

  # 启用评论
  comments = true
  # 自动生成多种尺寸，移动端省流量
[params.cover]
  linkFullImages = true
  responsiveImages = true

[params.giscus]
  repo = 'skyrim86/my-blog'
  repoID = "R_kgDOUQGEOA"
  category = 'Announcements'
  categoryID = "DIC_kwDOUQGEOM4DFHXE"
  # 按 URL 路径关联 Discussion。2026-09-18 从 'title' 改过来：站上有多对同名页面
  # （数值分析两章的「学习笔记」「作业」），按标题关联会把不同页面的评论并进同一条，
  # 而 URL 天然唯一。代价是改目录名/permalink 会丢关联，所以要固定 URL 就用管理页的 slug 字段。
  mapping = 'pathname'
  strict = '0'
  reactionsEnabled = '1'
  emitMetadata = '0'
  inputPosition = 'bottom'
  theme = 'light'
  lang = 'zh-CN'
  loading = 'lazy'
# ============================================
# 外观与首页
# ============================================
# 站点背景：**可切换的多套**。每套两张图 —— light 给浅色主题、dark 给深色主题，两张方向相反
# （日间偏亮、夜间偏暗），切换主题的观感是「换了个时辰」而不是「换了张壁纸」。分两张是必须的：
# 同一张夜景图压在 84% 的浅色蒙版下不是背景，是一块脏灰（换图时实测过）。
#
# 唯一事实源仍是这里：extend_head.html 把每套解析成带子路径前缀的 URL，生成一张只含 CSS 变量的
# 小外链 css/bg-image.css —— 模板里不写 <style>、CSS 里不硬编码 /my-blog/、换图只改本文件。
# 只请求当前生效的那一张：没有被 var() 求值的 URL，浏览器不会去下载。
#
# presets 留空 = 关闭背景、退回纯色主题（顶栏按钮也不出现）；只列一套 = 显示那一套、不显示按钮。
#
# 每套的字段：
#   id        属性选择器用的名字，只能用 [a-z0-9-]；非法会直接让构建报错（避免拼出坏选择器）
#   name      按钮 title 与读屏播报里显示的套名。写在配置里而非 i18n，与导航菜单的 name 同一做法
#   light     浅色主题那套用的图，assets/ 下的路径；缺一个就为该主题回退纯色
#   dark      深色主题那套用的图
#   position  可选，background-position，默认 center 30%
#   maskLight / maskDark  可选，蒙版三档不透明度 [顶, 中, 底]；省略则用 extend_head.html 里的兜底值
#             （兜底值刻意只放模板一处，CSS 那边不写第二份；见 docs/features.md ⑫）
#
# 蒙版数值跟着图走而不是写在 CSS 里。**2026-09-19 起蒙版的角色变了**：它不再是对比度保护层
# （那件事已经下放给压在壁纸上的文字各自的局部玻璃面，见 00-theme.css 与 docs/features.md ⑫），
# 只剩「透气」与兜底两件事，所以两套都降到了 0.05~0.35 一带。数值全部是量过对比度定的，
# 不是调色调出来的。
[params.appearance]
  # 默认套的 id：无 JS 时（含爬虫与首屏渲染前）访客看到的就是这一套
  defaultPreset = 'girl'

[[params.appearance.presets]]
  id = 'girl'
  name = '黑长直少女'
  light = 'images/bg-daylight-girl.webp'
  dark = 'images/bg-night-girl.webp'
  # 横向取 78% 是为了**窄屏**：视口比 16:9 窄时（几乎全部设备）cover 是「按高度铺满、横向裁两边」，
  # 实测 375px 宽的手机只露出图片宽度的约 26%。两张图的人物分别在横向 66% 与 76% 处，
  # 取 78% 时可视窗口落在 [58%, 84%]，两个人都在窗口里；取默认的 center 就会把她们裁掉。
  position = '78% 25%'
  # 2026-09-19 降到 .26/.06/.32（原值 .58/.70/.82，更早是 .80/.88/.93）。
  # **中档最低是故意的**：三段渐变的停靠点是 0%/52%/100%，中档压到最低 = 画面中段基本不过滤，
  # 人物的颜色与亮度原样露出来，这就是「背景透亮」的来源；顶/底两档留一点，给页首页尾兜底。
  # 改这三个数（或改底衬的 --glass-tint）都要重跑 `.shots/girlbg/measure.py both`。
  maskLight = [0.10, 0.02, 0.14]
  maskDark = [0.08, 0.02, 0.12]

[[params.appearance.presets]]
  id = 'city'
  name = '城市'
  light = 'images/bg-daylight-city.webp'
  dark = 'images/bg-night-city.webp'
  position = 'center 30%'
  # 实拍照片本身横向均匀（大团积云边缘 / 亮窗对暗天），比少女套还能再薄一点
  maskLight = [0.20, 0.04, 0.26]
  maskDark = [0.26, 0.13, 0.46]

# 动态背景（WebGL shader）：开着的时候它顶掉壁纸图（--bg-image-* 置 none），蒙版与玻璃层照旧。
#
# 代价是**量过**的（lab/shots/bg-shader-contrast/ 与 docs/exp-bg.md）：RTX 5060 + 3.13 Mpx 出货分辨率下
# GPU 0.13 ms/帧（6.06 ms 帧预算的 2.1%）、主线程 0.007 ms/帧；真页面帧间隔 A/B 里量不到可归因于它的掉帧。
# 对比度也量过（同一套 WCAG 口径，逐帧取最坏）：深色主题最差 6.02、浅色 6.12，都**高于**静态壁纸的 5.31 / 4.82。
# 浅色主题是风险面（深字 + 会变暗的底），所以 shader 里按 data-theme 切两套配色，浅色那套是亮底白昼天光。
#
# 降级链（三条都在 bg-shader.js 里，都有实测）：prefers-reduced-motion → 整支脚本不挂载、壁纸保留；
# 无 WebGL / GLSL 编译失败 → 同样保留壁纸（摘图只发生在两者都成功之后）；页面不可见 → 停 rAF。
# 弹层打开时由 home-deck.js 停背景 rAF、关闭时恢复（卡的调速器与背景没有协调，弹层期间把预算全留给卡）。
[params.appearance.shader]
  enable = true
  # 渲染分辨率倍率。**这是第一个该拧的旋钮**：代价随 canvas 像素近似线性（1×/2×/4× = 0.13/0.52/1.37 ms），
  # 而 4×（50 Mpx）时帧间隔崩到 max 115 ms 的同时 shader 自己只有 1.37 ms —— 崩的是 canvas 层，不是着色。
  scale = 1.0
  # fbm 噪声层数：3 = 出厂，2 便宜约 40% 且看不出区别（原型实测 0.129 → 0.077 ms/帧）
  oct = 3
  # 重绘上限：每帧唤醒、每 33 ms 才画一次。同一 2.2 s 窗口里 draw 从 367 降到 61，
  # 而帧间隔在任何安静轮里都量不出差别（缓慢流动的极光看不出来）
  fps = 30

# 首页「最近更新」条数（0 = 不显示该区块），见 layouts/_partials/index_profile.html
[params.home]
  recentCount = 8
  # 首页 hero 底部的**卡片组**（一次一张，可手动切也会自己轮播）不在这里配置：
  # 它由 data/home-cards.yaml 这份清单驱动（生成器 tools/cards/make-cards.py），模板直接读它。
  # 这里曾经留着一条 `cards = [...]` 的四张图数组，模板早就不读它了（2026-09-20 删掉 ——
  # 一份改了不起作用的配置比没有配置更糟：改了看不到变化，只会去怀疑样式或缓存）。
  # 另一种出场形式（**当前关着**）：hero 里一块透明底场景插画。想切回它就把 chara 填上，
  # 尺寸由 charaWidth 给；它与卡片组互斥，两者都空着就是「hero 里只有文字」。
  # 由 tools/backgrounds/make-ayaka-home.py 从 source-ayaka-desk.png 生成。
  chara = ''
  charaWidth = 250

# ============================================
# 首页 Profile Mode 配置
# ============================================
[params.profileMode]
  enabled = true
  title = '你好，我是 Skyrim'
  subtitle = '个人学习记录'
  imageUrl = 'images/avatar.jpg'
  imageTitle = 'avatar'
  imageWidth = 120
  imageHeight = 120

# ============================================
# 搜索功能配置（Fuse.js）
# ============================================
# 注意：索引由 layouts/index.json 生成（覆盖了主题模板，把正文截断到 400 字）。
# 这里 keys 里出现的内容，索引模板必须实际输出同名字段，否则该项搜索无效。
[params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  location = 0
  distance = 1000
  threshold = 0.4
  minMatchCharLength = 1
  keys = ['title', 'permalink', 'summary', 'headings', 'tags', 'content']

