# ============================================
# Markdown 解析
# ============================================
# 开启 goldmark passthrough：公式在 markdown 解析阶段被整体跳过，源文原样送到浏览器端的
# KaTeX。否则 goldmark 会先改坏公式——正文里 R^* 的 * 会被当作强调符（与同行的 ** 配对）
# 并注入 <em>，把文本节点切开，导致 $...$ 无法配对而原样显示；\{ \} \% \! \, 这类由标点
# 构成的 LaTeX 命令也会被 CommonMark 的反斜杠转义规则吃掉反斜杠。
# 定界符必须显式写全，passthrough 默认不含单 $；KaTeX 仍按页面 front matter 的 math: true 加载。
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)'], ['$', '$']]

# ============================================
# 代码高亮
# ============================================
[markup.highlight]
  style = 'monokai'
  lineNos = true
  codeFences = true
  guessSyntax = true
  hl_Lines = ''
  lineNoStart = 1
  tabWidth = 4

# ============================================
# 图片处理优化
# ============================================
[imaging]
  quality = 75
  resampleFilter = 'lanczos'

# ============================================
# 安全设置（允许内联脚本等，Giscus 等需要）
# ============================================
# allow 只列**实际会用到**的外部程序：构建期只有 KaTeX 走 Hugo 内嵌实现（不 exec）、
# 资源管线只做 concat/minify/fingerprint（不 exec），enableGitInfo 由 go-git 直接读仓库
# （也不 exec）。原先还列了 dart-sass-embedded / postcss / npx / go —— 站上没有任何
# Sass、PostCSS 或 Hugo Modules 管线，那四项是照抄主题默认值留下的，2026-09-18 删除。
# 日后真加 PostCSS/Tailwind 时再把对应的加回来（Hugo 会明确报 "exec 被禁用"，不难诊断）。
[security]
  [security.exec]
    allow = ['^git$']
    osEnv = ['(?i)^((HTTPS?|NO)_PROXY|PATH|EXTENSIONS|DIR)$']