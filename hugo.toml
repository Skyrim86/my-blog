baseURL = 'https://skyrim86.github.io/my-blog/'
defaultContentLanguage = 'zh'
title = 'Skyrim'
theme = 'PaperMod'
hasCJKLanguage = true

enableRobotsTXT = true
# 启用 Emoji 支持
enableEmoji = true

# 启用 Git 信息（显示文章最后修改时间）
enableGitInfo = true

[frontmatter]
  lastmod = ['lastmod', ':git', 'date']
  date = ['date', 'publishDate', 'lastmod']

[taxonomies]
  tag = 'tags'
  category = 'categories'
  series = 'series'


# 语言配置
[languages]
  [languages.zh]
    locale = 'zh-CN'
    label = '中文'
    weight = 1
# 启用 RSS
[outputs]
  home = ['HTML', 'RSS', 'JSON']  # JSON 用于搜索功能

# 分页设置
[pagination]
pagerSize = 10

# 永久链接格式
[permalinks]
  [permalinks.page]
    posts = '/:year/:month/:slug/'
  [permalinks.section]
    posts = '/posts/'

# ============================================
# 核心参数配置
# ============================================
[params]
  # 主内容区：首页列表、归档、上下篇导航只统计这些 section。
  # 不把 courses 放进来，避免课程章节混进博客归档与上下篇导航。
  mainSections = ['posts']

  # 启用 OG/twitter meta 的开关
  env = 'production'

  #站点介绍
  description = 'Skyrim 的技术与生活博客'

  # 显示阅读时间
  ShowReadingTime = true

  # 显示文章目录
  ShowToc = true

  # 默认折叠目录
  TocOpen = true

  # 显示面包屑导航
  ShowBreadCrumbs = true

  # 显示文章上下篇导航
  ShowPostNavLinks = true
  # 显示代码复制按钮
  ShowCodeCopyButtons = true

  # 显示 RSS 订阅按钮
  ShowRssButtonInSectionTermList = true

  # 默认 Open Graph 图片（分享时显示）
  images = ['images/site-cover.jpg']

  # 日期格式
  DateFormat = '2006年1月2日'

  # 作者信息
  author = 'Skyrim'

  # 启用评论
  comments = true
  # 自动生成多种尺寸，移动端省流量
[params.cover]
  linkFullImages = true
  responsiveImages = true

[params.giscus]
  repo = 'skyrim86/my-blog'
  repoID = "R_kgDOUQGEOA"
  category = 'Announcements'
  categoryID = "DIC_kwDOUQGEOM4DFHXE"
  mapping = 'title'                # 按文章标题关联 Discussion（比 pathname 稳定）
  strict = '0'
  reactionsEnabled = '1'
  emitMetadata = '0'
  inputPosition = 'bottom'
  theme = 'light'
  lang = 'zh-CN'
  loading = 'lazy'
# ============================================
# 首页 Profile Mode 配置
# ============================================
[params.profileMode]
  enabled = true
  title = '你好，我是 Skyrim'
  subtitle = '个人学习记录'
  imageUrl = 'images/avatar.jpg'
  imageTitle = 'avatar'
  imageWidth = 120
  imageHeight = 120

# ============================================
# 搜索功能配置（Fuse.js）
# ============================================
# 注意：索引由 layouts/index.json 生成（覆盖了主题模板，把正文截断到 400 字）。
# 这里 keys 里出现的内容，索引模板必须实际输出同名字段，否则该项搜索无效。
[params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  location = 0
  distance = 1000
  threshold = 0.4
  minMatchCharLength = 1
  keys = ['title', 'permalink', 'summary', 'tags', 'content']

# ============================================
# 导航菜单
# ============================================
[[menu.main]]
  identifier = 'home'
  name = '🏠 首页'
  url = '/'
  weight = 10

[[menu.main]]
  identifier = 'courses'
  name = '🎓 课程'
  url = '/courses/'
  weight = 20

[[menu.main]]
  identifier = 'projects'
  name = '🚀 项目'
  url = '/projects/'
  weight = 30

[[menu.main]]
  identifier = 'posts'
  name = '📝 文章'
  url = '/posts/'
  weight = 40

[[menu.main]]
  identifier = 'archives'
  name = '📚 归档'
  url = '/archives/'
  weight = 50

[[menu.main]]
  identifier = 'tags'
  name = '🏷️ 标签'
  weight = 60
  url = '/tags/'

[[menu.main]]
  identifier = 'search'
  name = '🔍 搜索'
  url = '/search/'
  weight = 70

[[menu.main]]
  identifier = 'about'
  name = '📮 关于'
  url = '/about/'
  weight = 80

# ============================================
# Markdown 解析
# ============================================
# 开启 goldmark passthrough：公式在 markdown 解析阶段被整体跳过，源文原样送到浏览器端的
# KaTeX。否则 goldmark 会先改坏公式——正文里 R^* 的 * 会被当作强调符（与同行的 ** 配对）
# 并注入 <em>，把文本节点切开，导致 $...$ 无法配对而原样显示；\{ \} \% \! \, 这类由标点
# 构成的 LaTeX 命令也会被 CommonMark 的反斜杠转义规则吃掉反斜杠。
# 定界符必须显式写全，passthrough 默认不含单 $；KaTeX 仍按页面 front matter 的 math: true 加载。
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)'], ['$', '$']]

# ============================================
# 代码高亮
# ============================================
[markup.highlight]
  style = 'monokai'
  lineNos = true
  codeFences = true
  guessSyntax = true
  hl_Lines = ''
  lineNoStart = 1
  tabWidth = 4

# ============================================
# 图片处理优化
# ============================================
[imaging]
  quality = 75
  resampleFilter = 'lanczos'

# ============================================
# 安全设置（允许内联脚本等，Giscus 等需要）
# ============================================
[security]
  [security.exec]
    allow = ['^dart-sass-embedded$', '^go$', '^npx$', '^postcss$', '^git$']
    osEnv = ['(?i)^((HTTPS?|NO)_PROXY|PATH|EXTENSIONS|DIR)$']