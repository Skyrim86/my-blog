baseURL = 'https://skyrim86.github.io/my-blog/'
defaultContentLanguage = 'zh'
title = 'Skyrim'
theme = 'PaperMod'


enableRobotsTXT = true
# 启用 Emoji 支持
enableEmoji = true

# 启用 Git 信息（显示文章最后修改时间）
enableGitInfo = true

[taxonomies]
  tag = 'tags'
  category = 'categories'

# 语言配置
[languages]
  [languages.zh]
    locale = 'zh-CN'
    languageName = '中文'
    weight = 1
# 启用 RSS
[outputs]
  home = ['HTML', 'RSS', 'JSON']  # JSON 用于搜索功能

# 分页设置
[pagination] 
pagerSize = 10

# 永久链接格式
[permalinks]
  [permalinks.page]
    posts = '/:year/:month/:slug/'
  [permalinks.section]
    posts = '/posts/'

# ============================================
# 核心参数配置
# ============================================
[params]
  # 启用 OG/twitter meta 的开关
  env = 'production'

  #站点介绍    
  description = 'Skyrim 的技术与生活博客'

  # 默认主题：auto 跟随系统 / light / dark
  defaultTheme = 'auto'

  # 主题切换按钮
  ShowThemeToggle = true

  # 显示阅读时间
  ShowReadingTime = true

  # 显示文章目录
  ShowToc = true

  # 默认折叠目录
  TocOpen = true  

  # 显示面包屑导航
  ShowBreadCrumbs = true

  # 显示文章上下篇导航
  ShowPostNavLinks = true

  # 显示代码复制按钮
  ShowCodeCopyButtons = true

  # 显示 RSS 订阅按钮
  ShowRssButtonInSectionTermList = true

  # 分享按钮按需开启 
  ShowShareButtons = false 
  # 作者信息
  author = 'Skyrim'

  # 默认 Open Graph 图片（分享时显示）
  images = ['images/site-cover.png']

  # 日期格式
  DateFormat = '2006年1月2日'

  # 禁用主题切换动画（可选，觉得切换卡顿可以开）
  # disableThemeToggle = false 

# ============================================
# 首页 Profile Mode 配置
# ============================================
[params.profileMode]
  enabled = true
  title = '你好，我是 Skyrim'
  subtitle = '个人学习记录'
  imageUrl = 'images/avatar.png'
  imageTitle = 'avatar'
  imageWidth = 120
  imageHeight = 120

  # 首页按钮
  [[params.profileMode.buttons]]
    name = '📖 文章'
    url = '/posts/'
  [[params.profileMode.buttons]]
    name = '🏷️ 标签'
    url = '/tags/'
  [[params.profileMode.buttons]]
    name = '📮 关于'
    url = '/about/'

# ============================================
# 搜索功能配置（Fuse.js）
# ============================================
[params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  location = 0
  distance = 1000
  threshold = 0.4
  minMatchCharLength = 0
  keys = ['title', 'permalink', 'summary', 'content']


   
# ============================================
# 导航菜单
# ============================================
[[menu.main]]
  identifier = 'home'
  name = '🏠 首页'
  url = '/'
  weight = 10

[[menu.main]]
  identifier = 'posts'
  name = '📝 文章'
  url = '/posts/'
  weight = 20

[[menu.main]]
  identifier = 'archives'
  name = '📚 归档'
  url = '/archives/'
  weight = 30

[[menu.main]]
  identifier = 'tags'
  name = '🏷️ 标签'
  weight = 40
  url = '/tags/'

[[menu.main]]
  identifier = 'search'
  name = '🔍 搜索'
  url = '/search/'
  weight = 50

[[menu.main]]
  identifier = 'about'
  name = '📮 关于'
  url = '/about/'
  weight = 60

# ============================================
# 代码高亮
# ============================================
[markup.highlight]
  style = 'monokai'
  lineNos = true
  codeFences = true
  guessSyntax = true
  hl_Lines = ''
  lineNoStart = 1
  tabWidth = 4

# ============================================
# 图片处理优化
# ============================================
[imaging]
  quality = 75
  resampleFilter = 'lanczos'

# ============================================
# 安全设置（允许内联脚本等，Giscus 等需要）
# ============================================
[security]
  [security.exec]
    allow = ['^dart-sass-embedded$', '^go$', '^npx$', '^postcss$', '^git$']
    osEnv = ['(?i)^((HTTPS?|NO)_PROXY|PATH|EXTENSIONS|DIR)$']