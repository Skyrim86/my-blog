name: Validate and build
description: >-
  跑全部校验并构建站点。checks.yml（PR/分支）与 deploy.yml（push main）共用这一个动作，
  这样「同一套校验」不会两边漂移；校验不过就不会产出 public/，也就不会部署。

runs:
  using: composite
  steps:
    # Hugo 版本钉的**唯一事实源**。升级请跑 scripts/upgrade-hugo.sh <版本>，
    # 它会把这里、static/katex 的 CSS/fonts 与注释一起改掉并自校验（配对坑见 AGENTS 第 7 节）。
    - name: Setup Hugo
      uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
      with:
        hugo-version: '0.165.0'
        extended: true

    # 校验清单一致性：**阻断**。同一套校验规则在三处独立登记（这个 action.yml、
    # scripts/push-blog.sh、tools/admin/lib/checks.mjs 的 ITEMS），三处都没生成关系、
    # 靠人工同步，而漂移的代价很具体：push-blog 少一项 = 本地全绿推上去才被拦；
    # 体检面板少一项 = 面板谎报通过。这条断言「CI 里阻断的每一项，另外两处都必须有」，
    # 并顺带查阻断口径、时区单一来源、front matter 键表是否登记齐全。
    # 只读文本文件、不依赖构建产物，所以排在最前面（它挂了后面的内容检查就不必跑了）。
    # 注意：这条检查本身也登记在另外两处 —— 它要检查的正是自己被登记了没有。
    - name: 校验清单一致性（阻断）
      shell: bash
      run: node scripts/check-consistency.mjs

    # 标签词表：只警告不阻断（沿用 push-blog.sh 的语义，拼错会分裂出两个词条页，值得看见）
    - name: 标签词表校验（只警告）
      shell: bash
      run: bash scripts/check-tags.sh || echo "::warning title=标签词表::有未登记的标签，详见日志"

    # front matter：阻断。能拦住「整页没有 front matter」「缺 title/date/draft」
    # 「section 页写了 tags」这一类构建能过、页面其实是坏的问题。
    - name: front matter 校验（阻断）
      shell: bash
      run: bash scripts/check-frontmatter.sh

    # 卡片页与数据文件是否一致：阻断。CS 库的卡片页由 scripts/gen-cards.mjs 从
    # data/cs-toolbox.json 生成 —— 改了数据却忘了重生成时，页面上的正文还是旧的，
    # 而**构建不会报错**，只有比对才发现。只读 data/ 与 content/，不依赖构建产物，
    # 所以和上面几条一样排在快校验里。
    - name: 卡片页与数据一致性校验（阻断）
      shell: bash
      run: node scripts/gen-cards.mjs cs --check

    # 卡片数据不变量：阻断。每张卡都要有名字（外加 id/kind 非空、id 不重复）。名字的源头
    # 在仓库外的课程项目 md 里，CI 的机器上没有那个项目，所以这里查的是**产物**
    # data/*-toolbox.json —— 手改的数据、知识库发布、管理页改过的卡都绕不过它。
    # 无名卡在卡片墙上只是一个裸类别词（2026-09-19 之前数学库里就有 30 张这样的卡，
    # 「引理 4.1」「命题 4.6」铺了一墙）。只读 data/，不依赖构建产物，与上面几条同属快校验。
    - name: 卡片数据校验（阻断：每张卡都要有名字）
      shell: bash
      run: node scripts/check-cards.mjs

    # 工艺 × 卡面明度那条守卫（check-deck.mjs 的 ⑨）要**现算**每张卡面的明度，
    # 算法与阈值在 scripts/deck-edit.py 里（用 Pillow + numpy）—— ubuntu 镜像不保证带它们，
    # 所以这里显式装一次。不装的话 check-deck.mjs 会明确报「找不到装了 Pillow 的 Python」拦下，
    # 不会静默跳过那一条（那正是这个仓库最怕的失败方式）。
    #
    # 2026-09-25 修（这一处让 CI 从 09-24 起每一次都红）：原来只 `pip install pillow`，两个坑叠着 ——
    #   ① 探测函数查的是 `import PIL, numpy` 两个都在（deck-edit.py 的 lum() 用 numpy 取均值），
    #      只装 pillow 换不来通过；
    #   ② ubuntu 24.04 的 system python 带 EXTERNALLY-MANAGED 标记，裸 `pip install` 直接以
    #      externally-managed-environment 退出 1 —— 这一步一死，后面十几步全不跑，
    #      而 job 只报「校验并构建 failure」，看不出死在哪儿。
    # 现在：两个包一起装 + 三级回退（默认 → --break-system-packages → --user）+ 装完立刻断言
    # 两个都 import 得到，并把解释器名交给 check-deck（DECK_PYTHON），
    # 免得它去猜 ubuntu 上并不存在的 `python`。
    - name: 装 Pillow + numpy（check-deck 的工艺 × 明度守卫要用）
      shell: bash
      run: |
        python3 -m pip install --quiet --disable-pip-version-check pillow numpy \
          || python3 -m pip install --quiet --disable-pip-version-check --break-system-packages pillow numpy \
          || python3 -m pip install --quiet --disable-pip-version-check --user pillow numpy
        python3 -c "import PIL, numpy; print('Pillow', PIL.__version__, '| numpy', numpy.__version__)"
        echo "DECK_PYTHON=python3" >> "$GITHUB_ENV"

    # 首页卡片组的清单（data/home-cards.yaml）不变量：阻断。它和上面那条管的不是一套卡 ——
    # 这条只管首页 hero 底部那副牌。清单是那副牌的**单一事实源**，但此前没有任何脚本读它：
    # style 拼错会静默退回全息 foil、crop 拼错会静默改成整幅硬裁、src/产物路径写错会让模板
    # warnf 一下就跳过整张牌 —— 全都构建全绿，只能靠肉眼在三十张里发现。
    # 这条同时查：字段齐不齐、style 有没有对应的 .home-card--* 类、源图与产物在不在、
    # 有没有重名/重复产物、以及**目录里的孤儿产物**（撤卡后忘了删，2026-09-20 清出过 8 张）。
    # 只读 data/、assets/、i18n/，不依赖构建产物，所以和上面几条同属快校验。
    - name: 首页卡片组清单校验（阻断）
      shell: bash
      run: node scripts/check-deck.mjs

    # section 结构：阻断。断言每个 section 目录都有 _index.md（列表页）。
    # 缺了它，该分区会退化成「隐式 section」——页面能不能存在取决于下面还有没有子页面，
    # 子页面一删空，/posts/ 这类列表页就连同导航栏、首页指向它的入口一起 404。
    # 上面那条 front matter 检查只遍历**已存在的** .md 文件，看不见「文件缺失」，所以单列一条。
    # 只扫 content/、不依赖构建产物，所以和上面两条一样排在快校验里。
    - name: section 结构校验（阻断）
      shell: bash
      run: bash scripts/check-sections.sh

    # 公式里的 `\*`（KaTeX 无此命令）、`§`、圈号 ①②③ 都能被这份规则表机械修好，
    # 机械替换的语义风险只在「改哪个位置」，所以这里**只检查不修改**（CI 不该改内容）；
    # 本地 push-blog.sh 与管理页保存/新建会调同一个脚本自动修好。
    # 先跑 --selftest 盯住规则本身（该改的改、散文/代码块里的不动），再扫内容。
    - name: 公式转义检查（阻断：规则自测 + 内容扫描）
      shell: bash
      run: node scripts/fix-math-escapes.mjs --selftest && node scripts/fix-math-escapes.mjs

    # 公式内容预检：阻断。数学区里再嵌一个 `$`（区域被提前截断）、以及 JSON 双重转义
    # （`\\theta` 这类：连续反斜杠 + 字母，KaTeX 会把反斜杠对当换行符）都会让构建中止或静默渲染错，
    # CI 里**没法自动修**（真检的 --fix 是写操作，只能在本地跑），所以单列一步给出公式本体的行列号。
    # 与上一步同样的理由：Hugo 为这类错误报的 `文件:行:列` 是模板渲染位置、不是公式位置
    # （实测两个坏页都报 19:13，真缺陷在 107/160 行）。
    # 只扫 content/，不依赖构建产物。另：Hugo 一旦报渲染错误就会取消剩下的页面，
    # 所以它列出的坏页可能不全（实测这次 3 个坏页只报出 2 个），这一步能一次扫全。
    - name: 公式内容预检（阻断）
      shell: bash
      run: node scripts/check-math-syntax.mjs

    # 公式真检：阻断。快检只认已知的几类写法，这一步把每个数学区**逐条交给 Hugo 内嵌的 KaTeX**
    # 试渲染，覆盖全部语法错误（缺参数、环境没闭合、\left 没 \right、命令拼错…）。机制是模板里的
    # `try (transform.ToMath …)`（Hugo ≥ 0.141）：临时站点建在系统临时目录、用 --renderToMemory，
    # 既不写也不读仓库里的东西，用的 KaTeX 与线上完全同一套。
    # 先跑 --selftest 是有意的：真检的设计是「机制跑不起来只警告」（诊断工具坏了不该拦住发布），
    # 代价是机制静默失效也会退 0，所以在 CI（Hugo 版本钉死在这里）用自测把这件事盯住。
    - name: 公式真检（阻断：机制自测 + 逐条渲染）
      shell: bash
      run: node scripts/check-math-katex.mjs --selftest && node scripts/check-math-katex.mjs

    # archetypes 与管理页字段表是否分叉：只警告不阻断（内部一致性问题，不该拦内容发布）
    - name: 编辑器字段表漂移检查（只警告）
      shell: bash
      run: node scripts/check-editor-schema.mjs || echo "::warning title=编辑器字段表::archetypes 与管理页字段表已分叉，详见日志"

    - name: 构建
      shell: bash
      run: hugo --minify --gc --cleanDestinationDir

    # 公式本体的排版正确性只取决于「CSS 与 Hugo 内嵌 KaTeX 是否同套类名」，
    # 而这件事只有拿真实 Hugo 构建完才知道 —— 所以这条只能在构建后跑。
    - name: KaTeX 与 Hugo 版本配对校验（阻断）
      shell: bash
      run: bash scripts/check-katex-pairing.sh

    - name: 体积报告与预算（阻断）
      shell: bash
      run: bash scripts/report-size.sh

    - name: 站内链接与锚点检查（阻断）
      shell: bash
      run: node scripts/check-links.mjs

    # 按页拆包（2026-09-23）：卡片表与首页表是条件外链，接线在 extend_head.html 里。
    # 判据失效的症状是「不报错、那一段样式静静失效」，所以拿产物对账这条必须阻断。
    - name: CSS 按页拆包核对（阻断）
      shell: bash
      run: node scripts/check-css-split.mjs

    # SEO / 订阅产物：只警告不阻断。查的是「构建能过但站点不可被发现」的那类事 ——
    # sitemap 与 RSS 里的 URL 是否带 baseURL 子路径、是否都指向真实存在的页面、
    # 生产构建的 robots.txt 是否误禁全站、首页 meta 是否被 noindex、feed 里有没有
    # 零值日期（0001）与空 description。这些开关都在 hugo.toml 与主题模板里，
    # 改错不会有任何现有校验报警（起因见该脚本头部注释）。
    - name: SEO 与订阅产物体检（只警告）
      shell: bash
      run: node scripts/check-seo.mjs || echo "::warning title=SEO 体检::sitemap/robots/首页 meta/RSS 有异常，详见日志"
