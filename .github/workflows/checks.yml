name: Checks

# 非 main 的改动（PR、feature 分支、手动）走这里：只校验，不部署。
# main 的改动由 deploy.yml 跑同一套校验（共用 .github/actions/validate），校验不过就不部署。
on:
  pull_request:
  push:
    branches-ignore: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "checks-${{ github.ref }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # enableGitInfo 需要完整历史（fetch-depth: 0），勿删
          fetch-depth: 0

      - name: 校验并构建
        uses: ./.github/actions/validate
