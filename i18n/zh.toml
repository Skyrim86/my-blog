# 站点级 UI 文案：与主题 i18n 合并，同名 key 覆盖主题译文
# 模板中用 {{ i18n "key" (dict "参数" 值) }} 引用

[seriesTitle]
other = "📚 系列文章：{{ .name }}"

# ---------- 课程结构（见 layouts/courses/） ----------
# 课程主页的章节目录标题
[courseIndex]
other = "课程目录"

# 「第 N 章」/「第 N 周」：unit 来自课程主页 front matter 的 unit 字段
[courseUnitLabel]
other = "第 {{ .num }} {{ .unit }}"

# 课程按什么单位组织的说明
[courseOrganizedBy]
other = "本课程按{{ .unit }}组织"

# 章节入口页（选择进入学习笔记 / 作业）的标题
[courseMaterials]
other = "本章内容"

# 入口卡片上的附件数量
[courseAttachmentCount]
other = "{{ .count }} 个附件"

# 章节入口页的材料分组标题（见 layouts/courses/chapter.html）。
# 组别按材料目录名归类：notes* / homework* / lab*，其余进「其他」。
[courseGroupNotes]
other = "笔记"

[courseGroupHomework]
other = "习题"

[courseGroupLab]
other = "实验"

[courseGroupOther]
other = "其他"

# 章节目录里每个章节的材料数与最近更新（见 layouts/_partials/course-index.html）
[courseChapterMaterials]
other = "{{ .count }} 篇材料"

[courseUpdated]
other = "更新于 {{ .date }}"

# 课程规划与进度（见 layouts/_shortcodes/course-plan.html）
[coursePlanStat]
other = "已发布 {{ .done }} / {{ .total }} 章"

[coursePlanBuilt]
other = "已发布"

[coursePlanPlanned]
other = "计划中"

# 列表卡片上的计数 chips（见 layouts/_partials/card-chips.html）
[chipUnitCount]
other = "{{ .count }} {{ .unit }}"

[chipMaterials]
other = "{{ .count }} 篇材料"

[chipSubProjects]
other = "{{ .count }} 个子项目"

[chipDocs]
other = "{{ .count }} 篇文档"

# 附件下载区
[courseDownloads]
other = "📎 附件下载"

[courseDownloadAction]
other = "下载"

# ---------- 项目展示（见 content/projects/） ----------
# 项目详情页元信息面板中的技术栈标签
# 分层项目主页的子页目录标题（见 layouts/_partials/project-index.html）
[projectIndex]
other = "子项目与文档"

[projectTechStack]
other = "技术栈"

# 项目详情页的仓库链接按钮
[projectRepoLink]
other = "查看源码"

# ---------- 标签 / 分类 / 系列总览页的词条筛选框 ----------
# name 传页面标题，因此标签页显示「在标签中筛选…」
[termsFilterPlaceholder]
other = "在{{ .name }}中筛选…"

[termsFilterEmpty]
other = "没有匹配的词条"

# {shown} / {total} 同样是脚本替换的占位符（单花括号）。
# 这一条只给 .sr-only 的播报节点用，页面上不显示 —— 词条页的可见反馈是列表本身在变。
[termsFilterResult]
other = "显示 {shown} / {total} 个词条"

# ---------- 相关内容区块（见 layouts/_partials/related-content.html） ----------
# 按共享标签 / 系列把文章、课程、项目互相串联
[relatedTitle]
other = "🔗 相关内容"

# 列表项前的类型徽标
[relatedTypePost]
other = "文章"

[relatedTypeCourse]
other = "课程"

[relatedTypeProject]
other = "项目"

[relatedTypePage]
other = "页面"

# ---------- 导航（见 assets/js/nav-toggle.js） ----------
[navToggleLabel]
other = "展开或收起导航"

# 跳过导航链接（见 layouts/baseof.html）。它是 <body> 的第一个可聚焦元素，
# 键盘用户 Tab 一下就能越过 8 项导航直达正文。
[skipToContent]
other = "跳到正文"

# ---------- 主题模板里硬编码的英文可访问名（见 assets/js/a11y-controls.js） ----------
# PaperMod 的 header.html / footer.html / search.html 把这几个控件的可访问名写死成英文
# （"Toggle theme"、"go to top"、"search"、"search results"），中文站点上读屏用户听到的是英文。
# 脚本只补属性、不覆盖主题模板（AGENTS 规则 5/10）；文案经 data-* 传进去（规则 7）。
# 括号里的快捷键提示沿用主题的写法（Alt + T / Alt + G，与主题里那几个 accesskey 对应）。
[themeToggleLabel]
other = "切换深色/浅色主题"

[themeToggleTitle]
other = "切换主题 (Alt + T)"

# 底部「返回顶部」链接（页脚右下角那个箭头）
[topLinkLabel]
other = "回到页面顶部"

[topLinkTitle]
other = "回到顶部 (Alt + G)"

# 搜索页的输入框与结果列表（主题 search.html 里也是写死的英文）
[searchInputLabel]
other = "搜索"

[searchResultsLabel]
other = "搜索结果"

# ---------- 首页（见 layouts/_partials/index_profile.html） ----------
# 快捷入口（复用主导航，aria-label 用）
[homeQuickLinks]
other = "快捷入口"

# 首页「最近更新」区块
[homeRecent]
other = "最近更新"

# 「最近更新」过滤后一条都没有时的空状态
[homeRecentEmpty]
other = "这里还没有可显示的内容"

# 首页「站点规模」那行小字：每项的计数格式（库名来自 data/libraries.yaml，不在这里）
[homeCardsCount]
other = "{{ .n }} 张卡"

[homeCoursesCount]
other = "{{ .n }} 门课程"

[homeProjectsCount]
other = "{{ .n }} 个项目"

# 首页卡片组（layouts/_partials/home-cards.html + assets/js/home-deck.js）
# 占位符用 {n}/{total}/{label} 而不是 Hugo 的 {{ .x }}：这三个值是**换卡时**由 JS 填的
# （与 bgSwitchLabel 的 {name} 同一套做法）。
[deckNext]
other = "下一张卡"

[deckPrev]
other = "上一张卡"

[deckAnnounce]
other = "第 {n} 张，共 {total} 张：{label}"

# 卡片弹层（看大图）：按钮名 / 关闭 / 出处标签。卡片组那几条一样走 data-* 传给 JS。
[deckZoom]
other = "看大图"

[deckClose]
other = "关闭"

[deckCredit]
other = "出处"

[deckDialogLabel]
other = "{label}（大图）"

# 3D 查看器（assets/js/card-3d.js）：弹层里那张卡片可以拖着转、可以翻面。
# deckRotate 是画布上的操作提示（读屏用户看不到「拖动」这个手势，只能靠 aria 说），
# deckFlipBack 是翻面按钮切到背面之后的名字（按钮名要说明「按下会发生什么」）。
[deckFlip]
other = "翻到背面"

[deckFlipBack]
other = "翻回正面"

[deckRotate]
other = "{label}，第 {n} 张，共 {total} 张。拖动可转动卡片，翻面按钮看背面"

[deckGlFail]
other = "这台设备/浏览器没有可用的 WebGL，卡片只能看平面大图"

# 卡片等级（2026-09-20 加，2026-09-21 从四档扩到六档）。**只有 3D 卡背与角标会用到这些词** ——
# 卡面本身不写等级字（名字旁印的是**形状**徽章，色盲也能分，见 21-card-deck.css 的「等级」一节），
# 隐藏等级「奇迹」在显形前更不会出现，所以这几个词条的用途是「显形之后把话说全」+ 卡片墙的筛选条。
# 顺序按阶梯从低到高写（收藏 → 珍稀 → 史诗 → 秘藏 → 传世 → 奇迹），与 deck-wall.js 的 RANK_ORDER、
# card-3d.js 的 RANK_3D、以及 check-deck.mjs 里的 RANKS 一致。
[deckRankCollector]
other = "收藏"

[deckRankRare]
other = "珍稀"

[deckRankEpic]
other = "史诗"

[deckRankArcane]
other = "秘藏"

[deckRankLegend]
other = "传世"

[deckRankMiracle]
other = "奇迹"

# 收藏库（/collection/，见 docs/features.md ㊿）—— 十二种工艺的**中文名**。
# 这是全站第一次给「工艺」起对外名字：此前 style 只有代码名（foil / washi / kintsugi…），
# 中文叫法只出现在 21-card-deck.css 的注释与文档里，卡片墙的筛选项需要真名字。
# 取的就是 CSS 注释里那套叫法（全息 / 星芒全息 / 金边 / 玻璃 / 墨 / 和纸 / 雪华 / 金继）。
[deckStyleFoil]
other = "全息"

[deckStyleHoloPrism]
other = "星芒全息"

[deckStyleGold]
other = "金边"

[deckStyleGlass]
other = "玻璃"

[deckStyleInk]
other = "墨"

[deckStyleWashi]
other = "和纸"

[deckStyleYukika]
other = "雪华"

[deckStyleKintsugi]
other = "金继"

# 2026-09-21 新加的四种（三种工艺 + 冰裂）。分档：雕花金与珐琅彩是**进阶**，
# 星屑与冰裂是**普通**。分档口径的唯一事实源是 layouts/_partials/deck-manifest.html 的
# $styleTier 表（十二种各归一档，6 + 6），这里只给对外词。
[deckStyleFiligree]
other = "雕花金"

[deckStyleEnamel]
other = "珐琅彩"

[deckStyleStarnight]
other = "星屑"

[deckStyleFrostcrack]
other = "冰裂"

[deckStyleNacre]
other = "珍珠母贝"

[deckStyleSilver]
other = "烫银"

[deckStyleSilk]
other = "绸缎"

[deckStyleAurora]
other = "极光"

# 卡片墙的筛选条（三排 pill 由 assets/js/deck-wall.js 注入，文案经 data-* 传）。
# 三排都可以多选（同排 OR、排与排 AND），所以**没有「全部」这一颗**：把选中的 chip 再点一次
# 就是取消，整排清空由结果行末尾的「清空筛选」负责（2026-09-21 那一轮）。
# {n} 与 deckNext 那套一样是**由 JS 填**的占位符，不是 Hugo 模板变量。
[deckFilterLabel]
other = "按系列、工艺、等级筛选"

[deckFilterSeries]
other = "系列"

# 「工艺」而不是「风格」：代码与文档里一直叫 style/风格，但对外说 foil/washi/kintsugi 时
# 「工艺」才是那个意思（全息膜、和纸、金继都是做卡的工艺），读者不用先学一套内部词汇。
[deckFilterStyle]
other = "工艺"

[deckFilterRank]
other = "等级"

# 工艺那两档的**组标签**（代码名在 deck-manifest.html 的 $styleTier 表里）。标签本身是颗按钮：
# 按一下就把这一档当前够得着的工艺一次选中 / 取消 —— 十二项挨个点太费事。
[deckFilterTierBasic]
other = "普通"

[deckFilterTierAdvanced]
other = "进阶"

# 组标签的可读名：读屏用户只听到「普通」不知道按下去会怎样。{tier} 由 JS 填。
# 「这一档工艺」而不是「全部」：整档选中只收**当前够得着的**（别的排把它排除干净的项本来就是灰的）。
[deckFilterTierHint]
other = "{tier}工艺：选中或取消这一档工艺"

[deckFilterCount]
other = "共 {n} 张"

# 只在真有选中项时出现（在结果行末尾）。
[deckFilterClear]
other = "清空筛选"

# 理论上到不了这里：0 张的项已经置灰不可点，而每次选择都是往 OR 里「加」一项、结果只会变多。
# 留着当兜底（万一以后加了会把结果收窄的维度）。
[deckFilterEmpty]
other = "没有同时符合这三条的卡，换一个筛选试试"

# 卡片墙每一格的按钮名（deck-wall.js 把它升级成 <button> 时写进 aria-label）——
# 读屏用户听到的是「看《木刀》的三维卡」，而不是一串没有主语的「按钮」。
[deckOpenCard]
other = "看《{label}》的三维卡"

# ---------- 收藏库第二轮（2026-09-21 晚：序号 / 分组视图 / 抽卡 / 出处清单） ----------

# 每张卡在清单里的序号，印在格子下方那一行的名字前（`#07`）。**这是卡的身份证**：
# 63 张是一副有序的牌，首页名牌与弹层里那个 `07 / 63` 都是它，卡片墙此前缺了这一半。
# `{{ .n }}` 是 **Go 模板参数**（由 deck-wall.html 用 dict 填），与下面那些由 JS 填的
# `{n}` 不是一套写法 —— 这个键只在服务端渲染一次。
[deckTileNo]
other = "#{{ .n }}"

# 「按系列分组」的开关（平铺 ↔ 分组）。卡片墙默认平铺 —— 分组是给「找某一批」用的另一种读法。
[deckGroupOn]
other = "按系列分组"

[deckGroupOff]
other = "改回平铺"

# 分组视图里那一组的标题（系列名 + 张数），读屏与肉眼共用这一句。
# {series} / {n} 由 JS 填。
[deckGroupHead]
other = "{series} · {n} 张"

# 随机翻一张：角落那个像素小人按钮的名字，按下会从**当前筛选出来**的那些卡里抽一张打开。
[deckDraw]
other = "从当前这些里随机翻一张"

# 显形是**纯视觉**的变化（画布上那点光），读屏用户什么都得不到 —— 这条由 role="status" 播报。
[deckRevealAnnounce]
other = "《{label}》显形了：{rank}"

# 页尾那份折叠的出处清单（63 张卡的 credit 都来自清单，此前只有逐张打开弹层才看得到）。
# 展开前的摘要写「全部出处（63）」，展开后按系列分组列。
[deckCredits]
other = "全部出处（{{ .n }}）"

# 出处清单里那些没有可点链接的（官方立绘 / 站点自己的看板娘）：只写文字，不编链接。
[deckCreditsNote]
other = "带链接的是原图出处；没有链接的那几张是官方立绘或本站看板娘。"

# ---------- 数学工具库（见 layouts/courses/tools.html、assets/js/toolbox.js） ----------
# 搜索框提示（工具库页）
[toolboxSearch]
other = "搜索编号、标题或内容，例如「Gauss」「4.4」「方差」"

[toolboxFilterLabel]
other = "按分类筛选"

# 数学库页（layouts/library/*）：三级结构，大类 → 细分 → 卡片
# 大类卡上的一行小字（占位符是 Go 模板写法，配 dict 传参——写成 {sections} 会被 go-i18n 当模板吃掉，渲染成空串）
[libraryBranchMeta]
other = "{{ .sections }} 个细分 · {{ .cards }} 张卡"

# 大类页上「细分」那一段的标题
[librarySectionsTitle]
other = "细分"

# 面包屑区段名（读屏用）
[libraryCrumbsLabel]
other = "所在分支"

# 卡片页底部「返回数学库」的链接文字（卡片页同时保留返回本课程工具库）
[libraryName]
other = "数学库"

[toolboxAll]
other = "全部"

[toolboxEmpty]
other = "没有匹配的卡片"

# {shown} / {total} 是脚本替换的占位符（单花括号，别写成 Go 模板的 {{ }}）
[toolboxResult]
other = "匹配 {shown} / {total} 张"

# 卡片里折叠的证明
[toolboxProof]
other = "证明"

# 弹窗标题与关闭按钮
[toolboxTitle]
# 弹窗标题栏的文字。不写「数学工具库」：同一个弹窗也给 CS 库的卡片用
other = "卡片"

[toolboxClose]
other = "关闭卡片"

# 卡片标题旁的固定链接
[toolboxLinkLabel]
other = "这张卡片的固定链接"

# 卡片墙上「主卡 + 附属结论」那一家右侧折叠箭头的可访问名。
# 占位符是 Go 模板写法（配 dict 传参）；写成 {n} 会被 go-i18n 当模板吃掉，渲染成空串
[toolboxFamilyCount]
other = "{{ .n }} 个附属结论"

# 卡片底部的关系列表（见 layouts/_partials/card-rel.html）两个方向各一个标题。
# 两个词都不带「推出 / 使用」这类动词：三种附属结论的关系方向本来就不一样
# （引理是被主卡用到、推论是从主卡推出、性质是关于主卡描述的那个对象），一个动词盖不住。
# 附属结论 = 挂在它这一格下面、由它得出的引理 / 推论 / 性质
[toolboxRelKids]
other = "附属结论"

# 所属 = 本卡自己挂在哪个（或哪些）主卡下面。只有附属结论卡会有这一行
# （一张引理常挂在好几个定理下面）
[toolboxRelParents]
other = "所属"

# 弹窗里每栏右上角的关闭按钮（开出第二栏起才出现；关掉最后一栏就是关掉整个弹窗）
[toolboxPaneClose]
other = "关闭这一栏"

# 卡片页底部返回工具库
[toolboxBack]
other = "返回数学工具库"

# ---------- 看板娘（见 layouts/_partials/extend_footer.html） ----------
# 右下角固定半身像的可访问名；她就是站点图标那位
[mascotLabel]
other = "看板娘（点开关于页）"

# ---------- 页脚 RSS 入口（见 layouts/_partials/extend_footer.html） ----------
# 首页走 profileMode，不渲染 list.html 里那个带 RSS 图标的 page-header，
# 所以全站统一在页脚给一个订阅入口
[footerRss]
other = "RSS 订阅"

# ---------- 一键到底（见 layouts/_partials/extend_footer.html） ----------
# 主题的「返回顶部」是硬编码英文（go to top），这里两个按钮都补上中文可访问名
[bottomLinkLabel]
other = "滚到页面底部"

# ---------- 背景切换（见 assets/js/bg-switch.js、10-nav.css） ----------
# 2026-09-22 晚拆成两根轴：顶栏有**两个**图标按钮，文案也分两套（静态壁纸 / 动态背景）。
# {name} 由脚本替换成 hugo.toml 里那套的 name / 或「关闭」（单花括号是给 JS 的占位符，别写成
# Go 模板的 {{ }} —— 同 listToolsResult）。这 30 来行是那一轮**唯一**改了文案的地方。
[bgSwitchLabel]
other = "切换壁纸：当前 {name}"

# 切换后的读屏播报。它写进一个 .sr-only 的 role="status" 节点，页面上不显示：
# 背景切换是纯视觉变化，没有这个节点读屏用户什么都得不到。
[bgSwitchAnnounce]
other = "壁纸已切换到 {name}"

# 动态背景正开着时，「壁纸」按钮的那一下**不换套**（只把动态收起来、显示按钮上写着的那张），
# 所以按钮名要说清这件事 —— 否则点了没换下一张，看着像坏了。提示写在名字**之前**，
# 因为回归测（lab/结果/bg-shader-contrast/check-switch.py）取的是名字那一节。
[bgSwitchLabelDynOn]
other = "切换壁纸（点一下会关掉动态背景）：当前 {name}"

# 动态背景正开着时点「壁纸」按钮：这一下会**顺带把动态关掉**（两条轴互斥，同一时刻只显示一套），
# 所以播报要补一句 —— 只说「壁纸已切换到 X」的话，读屏用户不知道画面为什么整个变了。
[bgDynOffNote]
other = "，已关掉动态背景"

# 动态背景那个按钮：循环是「关闭 → 套1 → 套2 → … → 关闭」。
[bgDynLabel]
other = "切换动态背景：当前 {name}"

[bgDynAnnounce]
other = "动态背景：{name}"

[bgDynOff]
other = "关闭"

# 动态引擎在真正挂载时才发现跑不了（无 WebGL / 那套的着色器编译不过）：bg-shader.js 会把背景换回
# 静态套并派发 bg:dyn-unavailable，切换脚本撤掉按钮后播报这一句。{name} = 换回的那张壁纸名。
[bgDynUnavailable]
other = "此设备跑不了动态背景，壁纸已回到 {name}"

# ---------- 列表排序与标签筛选（见 assets/js/list-tools.js） ----------
# JS 不能调 i18n，这些文案由 extend_head.html 经 <script> 的 data-* 传给脚本
[listToolsSort]
other = "排序"

[listToolsDefault]
other = "默认顺序"

[listToolsNewest]
other = "最新在前"

[listToolsOldest]
other = "最早在前"

[listToolsTags]
other = "按标签筛选"

[listToolsAll]
other = "全部"

[listToolsEmpty]
other = "没有匹配的条目（换个标签试试）"

[listToolsResult]
other = "显示 {shown} / {total} 条"

# ---------- 标签总览页的分组（见 layouts/taxonomy.html + data/tag-groups.yaml） ----------
# 分组表里漏掉的词条会落在这一块
[termsUngrouped]
other = "未分组"

# ---------- 404 页（见 layouts/404.html，覆盖主题那份只有「404」三个字的模板） ----------
[notFoundHint]
other = "这个地址下没有内容。可能是链接旧了，或者路径拼错了。"

[notFoundLinks]
other = "可以试试这些入口"

[notFoundHome]
other = "回到首页"

[notFoundSearch]
other = "搜一下"

# ---------- 列表结果播报（见 assets/js/a11y-announce.js） ----------
# 搜索结果由主题的 fastsearch.js 异步写入 #searchResults，且该容器在主题模板里没有 aria-live，
# 读屏用户得不到任何反馈。这里的文案由站点脚本经 data-* 取到后写进一个 .sr-only 的
# role="status" 节点。{count} 是脚本替换的占位符（单花括号，别写成 Go 模板的 {{ }}）。
[searchResultCount]
other = "找到 {count} 条结果"

[searchNoResult]
other = "没有找到结果"

# ---------- 正文图片灯箱（见 assets/js/lightbox.js） ----------
# dialog 的 aria-label 与关闭按钮的可访问名。文案在这里，由 extend_head.html 经 data-* 传给脚本。
[lightboxLabel]
other = "放大的图片"

[lightboxClose]
other = "关闭"

# ---------- 首页的时钟（layouts/_partials/home-clock.html + assets/js/home-clock.js） ----------
# 面板本身由脚本填内容并按秒更新 —— 服务端渲染出来的时间只可能是**构建那一刻**，
# 放上去就是错的，所以面板出厂带 data-pending、由脚本摘掉（没有 JS 就不显示这块）。
# 星期用下标 = JS 的 Date.getDay()（0 = 周日），别按「周一开头」的习惯写。
[clockLabel]
other = "现在时间"

# {y} {m} {d} 是脚本替换的占位符（单花括号，别写成 Go 模板的 {{ }}），与 searchResultCount 同一套做法
[clockDate]
other = "{y}年{m}月{d}日"

[clockDow0]
other = "星期日"
[clockDow1]
other = "星期一"
[clockDow2]
other = "星期二"
[clockDow3]
other = "星期三"
[clockDow4]
other = "星期四"
[clockDow5]
other = "星期五"
[clockDow6]
other = "星期六"

[clockGreetMorning]
other = "早上好"
[clockGreetNoon]
other = "中午好"
[clockGreetAfternoon]
other = "下午好"
[clockGreetEvening]
other = "晚上好"
[clockGreetLate]
other = "夜深了"

# 时钟里的今年进度与脚注（数字由脚本算，标签是模板渲染的）
# 原来的 [clockToday]「今天已过」在 2026-09-21 被**今日那条 24 小时轴**取代了
# （同一条进度换了个画法：轴上的游标比一根进度条更能读「今天走到哪」），
# 所以那个键跟着删掉了 —— 留着就是没人引用的死文案。
[clockYear]
other = "今年已过"
[clockDayOfYear]
other = "今年第 {n} 天"
[clockYearLeft]
other = "还剩 {n} 天"

# ---------- 时间卡里的打卡月历、今日轴、今日一卡（2026-09-21 加） ----------
# 与上面同一套：**标签**由模板渲染（不随时间变），**数字与日期**经 data-* 交给脚本填。
# 占位符一律单花括号 {n} / {y}{m}，别写成 Go 模板的 {{ }}。
# 打卡点的口径：那天有**内容页**被提交过（取 .Lastmod，即 git 时间，与右栏「最近更新」同源）；
# 只改样式或工具的提交不算。见 docs/features.md ㊾。
[clockCalLabel]
other = "本月打卡"

# 月历表头的星期缩写：**单字、且按周一起排**（网格第一列是周一，与 clockDow* 那套 0=周日 的
# 下标习惯相反）—— 所以另起一组键，别拿 clockDow* 去截第一个字（「星期日」首字是「星」）。
[clockCalDow0]
other = "一"
[clockCalDow1]
other = "二"
[clockCalDow2]
other = "三"
[clockCalDow3]
other = "四"
[clockCalDow4]
other = "五"
[clockCalDow5]
other = "六"
[clockCalDow6]
other = "日"

# {y} {m} 是脚本替换的年份与月份（不补零）
[clockCalMonth]
other = "{y} 年 {m} 月"

# {n} 是没补零的天数：本月记录几天、连续几天
[clockCalRecords]
other = "记录 {n} 天"
[clockCalStreak]
other = "连续 {n} 天"
# 本月一天都没有时用这句（月初、或刚建站），别显示「记录 0 天」
[clockCalEmpty]
other = "本月还空白"

# 今日那条 24 小时轴：左标签固定，「已过 / 还剩」那句带三个占位符
# （{p} 是百分比，{h} {m} 是剩余的小时与分钟）
[clockAxisToday]
other = "今日"
[clockAxisLast]
other = "已过 {p} · 还剩 {h} 小时 {m} 分"

# 矮档（1024~1400px）那条「本月 mini 条」的左标签；右边的百分比由脚本填
[clockMonth]
other = "本月"

# 今日一卡：可见的两个字由模板渲染，aria 与「抽到奇迹」的播报带占位符
[clockDaily]
other = "今日一卡"
[clockDailyAria]
other = "今日一卡：{label}，{series}，{rank}，点开看这张卡"
[clockDailyReveal]
other = "今日一卡抽到奇迹 · {label}"
