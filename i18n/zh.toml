# 站点级 UI 文案：与主题 i18n 合并，同名 key 覆盖主题译文
# 模板中用 {{ i18n "key" (dict "参数" 值) }} 引用

[seriesTitle]
other = "📚 系列文章：{{ .name }}"

# ---------- 课程结构（见 layouts/courses/） ----------
# 课程主页的章节目录标题
[courseIndex]
other = "课程目录"

# 「第 N 章」/「第 N 周」：unit 来自课程主页 front matter 的 unit 字段
[courseUnitLabel]
other = "第 {{ .num }} {{ .unit }}"

# 课程按什么单位组织的说明
[courseOrganizedBy]
other = "本课程按{{ .unit }}组织"

# 章节入口页（选择进入学习笔记 / 作业）的标题
[courseMaterials]
other = "本章内容"

# 入口卡片上的附件数量
[courseAttachmentCount]
other = "{{ .count }} 个附件"

# 章节目录里每个章节的材料数与最近更新（见 layouts/_partials/course-index.html）
[courseChapterMaterials]
other = "{{ .count }} 篇材料"

[courseUpdated]
other = "更新于 {{ .date }}"

# 课程规划与进度（见 layouts/_shortcodes/course-plan.html）
[coursePlanStat]
other = "已发布 {{ .done }} / {{ .total }} 章"

[coursePlanBuilt]
other = "已发布"

[coursePlanPlanned]
other = "计划中"

# 列表卡片上的计数 chips（见 layouts/_partials/card-chips.html）
[chipUnitCount]
other = "{{ .count }} {{ .unit }}"

[chipMaterials]
other = "{{ .count }} 篇材料"

[chipSubProjects]
other = "{{ .count }} 个子项目"

[chipDocs]
other = "{{ .count }} 篇文档"

# 附件下载区
[courseDownloads]
other = "📎 附件下载"

[courseDownloadAction]
other = "下载"

# ---------- 项目展示（见 content/projects/） ----------
# 项目详情页元信息面板中的技术栈标签
# 分层项目主页的子页目录标题（见 layouts/_partials/project-index.html）
[projectIndex]
other = "子项目与文档"

[projectTechStack]
other = "技术栈"

# 项目详情页的仓库链接按钮
[projectRepoLink]
other = "查看源码"

# ---------- 标签 / 分类 / 系列总览页的词条筛选框 ----------
# name 传页面标题，因此标签页显示「在标签中筛选…」
[termsFilterPlaceholder]
other = "在{{ .name }}中筛选…"

[termsFilterEmpty]
other = "没有匹配的词条"

# ---------- 相关内容区块（见 layouts/_partials/related-content.html） ----------
# 按共享标签 / 系列把文章、课程、项目互相串联
[relatedTitle]
other = "🔗 相关内容"

# 列表项前的类型徽标
[relatedTypePost]
other = "文章"

[relatedTypeCourse]
other = "课程"

[relatedTypeProject]
other = "项目"

[relatedTypePage]
other = "页面"

# ---------- 导航（见 assets/js/nav-toggle.js） ----------
[navToggleLabel]
other = "展开或收起导航"

# ---------- 首页（见 layouts/_partials/index_profile.html） ----------
# 快捷入口（复用主导航，aria-label 用）
[homeQuickLinks]
other = "快捷入口"

# 首页「最近更新」区块
[homeRecent]
other = "最近更新"

[homeRecentAll]
other = "按分类浏览 →"
