{{- /* 卡片的手绘感滤镜（**必须内联在文档里**，data-URI 里的 filter 在 WebKit 上不可靠）
     —— 见 21-card-deck.css 里 --cfilter 那条的说明。

     2026-09-21 从 home-cards.html 抽出来：收藏库（/collection/）的卡片墙要用**同一套**滤镜，
     而滤镜是按 id 引用的（CSS 里 `filter: url(#deck-rough)`），页面里没有这两个 <svg> 时
     CSS 不会报错、只是那张卡悄悄没有手绘边（docs/traps.md 里记着这个静默失败）。
     两页共用一份的定义写在这里，谁用谁 include。

     零尺寸、不占位；两个：普通纹样（scale 3）与裂缝/扇骨（scale 5）。
     check-deck.mjs 会拿本文件里的 id 去核对 CSS 里的每个 url(#…)。 */ -}}
<svg class="home-deck-filters" width="0" height="0" aria-hidden="true" focusable="false">
    <filter id="deck-rough" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.02 0.04" numOctaves="2" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="deck-rough-crack" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.035 0.05" numOctaves="2" seed="11" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
</svg>
