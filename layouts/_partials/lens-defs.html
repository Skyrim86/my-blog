{{- /* 玻璃透镜的 SVG 滤镜定义。由 layouts/baseof.html 在 <body> 开头直接调用（不走 hook）。

   为什么放 <body> 开头：<head> 里放 <svg> 不是合法 HTML，解析器会把它挪走、位置不可控；放到
   </body> 前（extend_footer）又赶不上首帧，那几帧里 filter:url(#…) 取不到定义，面板会以
   「有玻璃底、没有折射」的样子先画一次，然后突然弯一下。放在这里两个问题都没有。
   代价只是每页多约 1KB 的静态标记（partialCached 只渲染一次）。

   为什么要滤镜：backdrop-filter 只接受 filter 函数、**不接受 url() 引用**（Chromium/WebKit
   都不支持），所以「真折射」做不进 backdrop-filter，只能在面板内部复制一份背景层再位移它。
   机制与取舍见 assets/css/extended/20-lens.css。

   参数为什么是这几个（2026-09-19 实测定的）：
     - baseFrequency 与 scale 一起决定「看不看得出折射」。三档对照（同一页面截图）：
         0.004 / scale 16  → 读起来只是「缓慢平移」，等于白做；
         0.012 / scale 45  → 看得出波纹；
         0.03  / scale 90  → 像液态大理石，人物五官被拉坏，且位移超出裁切余量、边缘出现硬缺口。
       取中间那档，读起来是「厚玻璃」而不是「果冻」。
     - primitiveUnits 显式写 userSpaceOnUse：baseFrequency 于是按 px 计，与元素尺寸无关。
       默认值本来就是它，但正文面板能有 4000px 高，一旦有人改成 objectBoundingBox，噪声会被
       沿长边拉长成条纹 —— 这个坑不写明白下次改的人一定会踩。
     - numOctaves=3：给足细节才有波纹质感；1 层太光滑，看不出位移。
     - scale 是位移上限（px），**必须 <= 20-lens.css 里的 --lens-bleed**，否则伪元素四边的余量
       不够，滤镜会采样到盒子外，边缘出现硬切的透明缺口（scale 90 那档就是这么坏的）。
     - 滤镜区域收窄到 ±6%：区域越大 feTurbulence 要算的像素越多；6% 对常见宽度已足够盖住位移
       （720px 宽的面板 = 43px）。
     - seed 固定：同一份观感在每次构建、每台机器上都一样，截图对拍才有意义。
     - 这里刻意不放 feGaussianBlur：原来的「毛玻璃」来自 backdrop-filter: blur()，而现在面板里
       是背景图副本、上面还压着 --surface 的 tint，再糊一层就完全看不出折射了 ——
       透镜要的是「清」不是「磨」。

   只有配了站点背景（[params.appearance].presets）才输出：没背景就没什么可折射的，
   而 20-lens.css 是用 body:has(> .lens-defs) 给整套机制设开关的，这里不输出 = 整套不生效。 */ -}}
{{- with site.Params.appearance.presets }}
<svg class="lens-defs" aria-hidden="true" focusable="false" width="0" height="0">
  <defs>
    <filter id="lens-panel" x="-6%" y="-6%" width="112%" height="112%"
            color-interpolation-filters="sRGB" primitiveUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.010 0.012" numOctaves="3" seed="7" result="lens-noise"/>
      <feDisplacementMap in="SourceGraphic" in2="lens-noise" scale="30"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="lens-sm" x="-6%" y="-6%" width="112%" height="112%"
            color-interpolation-filters="sRGB" primitiveUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.022 0.026" numOctaves="2" seed="11" result="lens-noise-sm"/>
      <feDisplacementMap in="SourceGraphic" in2="lens-noise-sm" scale="14"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="lens-bg" x="-6%" y="-6%" width="112%" height="112%"
            color-interpolation-filters="sRGB" primitiveUnits="userSpaceOnUse">
      <!-- 整页壁纸压在 0.66~0.93 的蒙版下，同一档强度在这里会「看不出」，所以比面板那档更粗：
           0.0018/scale 14 实测与原图几乎无差别，0.010/scale 24 才读得出「透过厚玻璃」。 -->
      <feTurbulence type="fractalNoise" baseFrequency="0.010 0.012" numOctaves="2" seed="3" result="lens-noise-bg"/>
      <feDisplacementMap in="SourceGraphic" in2="lens-noise-bg" scale="24"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
{{- end }}
