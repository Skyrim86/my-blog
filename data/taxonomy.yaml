# 站点标签 / 分类词表 —— 全站唯一事实源
#
# 为什么需要它：标签靠手写会产生同义漂移（例如「数值分析」与「科学计算」被当成两个词），
# 词条页会因此碎片化。新建内容时从这份词表里选，拼写就永远是同一个。
#
# 格式约定（scripts/new-content.sh 与 scripts/check-tags.sh 会解析本文件，别改成别的写法）：
#   - 分节用顶层键 `tags:` / `categories:`
#   - 词条每行一个，写成「两个空格 + 连字符 + 一个空格 + 词条」
#   - 分组只用注释（`#` 开头），不要引入嵌套层级
#   - 词条不要加引号（含冒号等 YAML 特殊字符时才需要，正常别用）
#
# 需要新标签时：用 scripts/new-content.sh 的 --new-tag，脚本会自动追加到这里，
# 而不是让你手改这个文件。

tags:
  # ---- 技术栈 ----
  - Hugo
  - CSS
  - Go Template
  - GitHub Actions
  # ---- 学科 / 课程 ----
  - 数值分析
  - 数学
  - 科学计算
  # ---- 竞赛 / 项目 ----
  - 数学建模
  - CMC2026

categories:
  - 建站
  - 课程
  - 项目
