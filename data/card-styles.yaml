          - color: "rgba(255, 236, 186, .26)"
            at: "45.5%"
          - color: "rgba(255, 249, 228, .62)"
            at: "48.5%"
          - color: "rgba(255, 236, 186, .24)"
            at: "51.5%"
          - color: "rgba(255, 240, 200, 0)"
            at: "58%"
      - kind: linear
        direction: "112deg"
        stops:
          - color: "rgba(255, 236, 186, 0)"
            at: "63%"
          - color: "rgba(255, 244, 205, .30)"
            at: "66%"
          - color: "rgba(255, 240, 200, 0)"
            at: "70%"
      - kind: repeating-linear
        direction: "96deg"
        stops:
          - color: "rgba(255, 236, 186, 0)"
            at: "0 1.7px"
          - color: "rgba(255, 236, 186, .15)"
            at: "2.5px 3.4px"
          - color: "rgba(120, 86, 20, .13)"
            at: "4.6px 5.5px"
          - color: "rgba(255, 236, 186, 0)"
            at: "6.7px 9.4px"
      - kind: radial
        size: "126% 96%"
        at: "50% 46%"
        stops:
          - color: "rgba(60, 40, 6, 0)"
            at: "46%"
          - color: "rgba(40, 26, 4, .34)"
            at: "100%"
