# 卡片工艺的参数表 —— **工艺定义的单一事实源**（2026-09-21 起的样板，见 docs/exp-craft.md）
#
# 2026-09-24：工艺从**十六种收敛到八种**（用户拍定，依据是 docs/card-redesign-brief.md 的
# §八 样张实测、§十六 工艺 × 卡面适配表、§十八 三档规则）。八种分两族：
#   · 光系（保留的四种）：holo-prism 星芒全息 / foil 全息 / silver 烫银 / starnight 星屑
#   · 印刷系（新做的四种）：emboss 凸印压痕 / pearl 珠光纸 / goldfoil 烫金箔 / inkwash 墨染
#   汰掉的十种（washi 和纸 / yukika 雪华 / frostcrack 冰裂 / nacre 珍珠母贝 / silk 绸缎 /
#   glass 玻璃 / kintsugi 金继 / filigree 雕花金 / enamel 珐琅彩 / aurora 极光）按**观感方向**
#   逐张并进上面八种，映射逐张记在 data/home-cards.yaml 的组注释里。为什么收：十六种里有一半
#   在 272px 的卡面上与近亲分不开（同一原子配方的变体），而每多一种就多一套浅色/深色主题的维护面。
#
# **foil 是特例**：它没有主块 —— `.home-card` 的基础声明本身就是全息的观感（见
# assets/css/decks/21-card-deck.css 文件尾那条说明），所以它不在下面的 styles 表里，
# 但它是合法的 style 值（清单里 5 张）。
#
# 一种工艺散在**五处**：① data/home-cards.yaml 的 style 字段 ② assets/css/decks/21-card-deck.css
# 的 `.home-card--<名>` 块 ③ assets/js/card-3d.js 的 STYLE_3D ④ i18n/zh.toml 的 `[deckStyle<名>]`
# ⑤ layouts/_partials/deck-manifest.html 的 styleLabel 与 $styleTier 两张表。
# 这份文件把 ②③ 变成**生成的**：
#     node tools/cards/render-styles.mjs --write
# 它读这里、写出 assets/css/decks/21-card-styles.css，并把 ③ 的那些行重写进 card-3d.js。
# `node scripts/check-deck.mjs` 会核对产物与这份文件是否逐字一致（不一致 = 阻断）——
# 所以**下面这几种工艺的参数行不要再手改**：手改过的会被生成器覆盖，且首先会被 check-deck 拦下。
#
# ④⑤ 仍**没有**参数化（还是手写）：中文名归 i18n（AGENTS 规则 7：面向访客的文案放 i18n/zh.toml），
# 两张分类表在模板里。labelKey / tier 两个字段就是为了「将来把 ⑤ 也接过来」先留的位
# —— 现在它们在 check-deck 里与模板那两张表**对拍**（写岔了报错），这样表还在模板里也不会读岔。
#
# **工艺与等级正交**：工艺只管纹样材质，等级只管结构（带宽 / 角饰 / 材质底色 --cframe）。
# 工艺能写的只有 --cframe-finish，写 --cframe 会把等级色阶整片盖掉（21-card-deck.css 第 6 条规矩）。
#
# **工艺 × 卡面明度**（brief §十八）：卡面明度分三档，每档各有一个「允许工艺」集合：
#   亮 ≥185 → 凸印 / 珠光 / 烫银 / 烫金 / 全息
#   中 140~185 → 上面的 + 星芒全息
#   暗 <140 → 凸印 / 烫金 / 全息 / 星芒全息 / 星屑 / 墨染
# 这条规则的**唯一一份实现**是 scripts/deck-edit.py 的 CRAFT_RULE（管理页的收藏库面板与
# check-deck.mjs 的守卫都从那里读）—— 别在这份文件、也别在别的脚本里再抄一份。
# 明度由脚本**现算**（卡面灰度均值，缩到 60×84 再取均值），不写死进清单：换图后自动重算。
# 要破例就在 data/home-cards.yaml 里显式写 `craft_exempt: true`，守卫放行但会把豁免打出来。
#
# 字段（一种工艺一组）：
# 字段（一种工艺一组）：
#   labelKey   ④ 的中文名词条名。check-deck 核它在 i18n 里存在、且与 ⑤ 的 styleLabel 一致
#   tier       ⑤ 的分档（basic 纸面 + 单层印纹 / advanced 多层材料）。check-deck 核它与 $styleTier 一致
#   note       写进生成 CSS 的注释（工艺的一句话说明）
#   fretLine   --fret-line：边框**装饰线**的材质色（结构归等级，见 21-card-deck.css 第 6 条规矩）
#   gemColor   --craft-gem-color：工艺的宝石/徽记色
#   finish     --cframe-finish：框的质感层（渐变）。**不许写 --cframe**（那是等级的材质底色）
#   plate      --cplate：名牌与卡背的底色（渐变）
#   plateSolid --cplate-solid（取不到渐变时的实底）  plateText / plateAccent：名牌文字与强调色
#   blend      --cblend：印纹层与画作的混合方式
#   opacity    --coverlay-op：印纹层不透明度（深色主题那几条覆写在 21-card-deck.css 的「深色主题」段）
#   mask       --coverlay-mask：印纹层的遮罩，**可以是多层**（数组，与 print 同构；目前
#              只有星屑那一档用，`ref: "--tex-starfield"`），不给 = 全卡都显
#   maskSize / maskPosition / maskRepeat  --cmask-size / --cmask-position / --cmask-repeat（标量）
#   filter     --cfilter：none 或 url(#<id>)，id 必须在 layouts/_partials/deck-filters.html 里
#   boxShadow  玻璃那种「材质长在盒模型上」的部分（倒角/边缘折射/体积光），原样透传，写在 --cfilter 之后
#   print      --coverlay 的图层栈，**数组顺序 = CSS 里写出来的顺序**（上→下）。每个图层：
#                kind: linear | radial | repeating-linear | repeating-radial | conic | repeating-conic | token
#                direction: 140deg / to top（linear 用）   at / size：radial 用（如 42% 38% / 120% 90%）
#                stops: 一组 { color, at? }；at 可省略（省略 = 不给位置），也可含两个位置（如 "0 6px"）
#                token 层只写 ref: --grain-fine
#   threeD     ③ STYLE_3D 的那一行。**值一律写成字符串**（保原样：0.20 不等于 0.2 好看、
#               但 emission 要逐字复现旧行，所以渲染器不做数值归一化）。
#
# 单位与写法约定：颜色/长度与手写版逐字一致（生成器不做格式化），`#rrggbb` 要加引号
# （值里出现 ` #` 会被 YAML 当行尾注释）。

version: 1

styles:

  # ================================================================ 光系（保留的四种）
  # foil 不在这个表里：它的「主块」就是 .home-card 的基础声明本身（见文件头）。

  # ---------------------------------------------------------------- deckStyleHoloPrism

  holo-prism:
    labelKey: "deckStyleHoloPrism"
    reliefPattern:            # 工艺纹样进浮雕高度图（2026-09-25）：星芒全息·放射线+同心环
      kind: none        # 形态问题，不是遮罩问题：阈值化遮罩后人物上只剩「极淡」，但均匀白线+同心环在 1:1 读成**几何干扰**（像 CAD 线框/蛛网，缺全息该有的衍射与层次）—— 要重做成星芒形+衍射晕，见 docs/pending.md
    tier: "advanced"
    note: "星芒全息（holo-prism）：以画面上方三分之一处为中心的**放射虹彩** + 几颗星点 + 大扫光。"
    fretLine: "linear-gradient(100deg, #ffd9a0, #ff9ec4 28%, #a0e8ff 52%, #c9a0ff 76%, #ffe6b0)"
    gemColor: "#d9c9ff"
    finish:
      kind: linear
      direction: "140deg"
      stops:
        - color: "rgba(255, 255, 255, .46)"
        - color: "rgba(226, 236, 255, .22)"
          at: "42%"
        - color: "rgba(255, 255, 255, .42)"
    plate:
      kind: linear
      direction: "to top"
      stops:
        - color: "rgba(16, 14, 26, .92)"
        - color: "rgba(16, 14, 26, .6)"
    plateSolid: "rgba(16, 14, 26, .88)"
    plateText: "#f4f2ff"
    plateAccent: "#d9c9ff"
    blend: "overlay"
    opacity: ".8"
    filter: "url(#deck-rough)"
    print:
      - kind: repeating-conic
        direction: "from 0deg at 50% 34%"
        stops:
          - color: "rgba(255, 148, 204, 0)"
            at: "0 1deg"
          - color: "rgba(255, 148, 204, .42)"
            at: "2.4deg 5deg"
          - color: "rgba(255, 148, 204, 0)"
            at: "6deg 12deg"
          - color: "rgba(156, 255, 214, 0)"
            at: "12deg 13deg"
          - color: "rgba(156, 255, 214, .38)"
            at: "14.4deg 17deg"
          - color: "rgba(156, 255, 214, 0)"
            at: "18deg 24deg"
          - color: "rgba(148, 204, 255, 0)"
            at: "24deg 25deg"
          - color: "rgba(148, 204, 255, .42)"
            at: "26.4deg 29deg"
          - color: "rgba(148, 204, 255, 0)"
            at: "30deg 36deg"
          - color: "rgba(204, 156, 255, 0)"
            at: "36deg 37deg"
          - color: "rgba(204, 156, 255, .38)"
            at: "38.4deg 41deg"
          - color: "rgba(204, 156, 255, 0)"
            at: "42deg 48deg"
      - kind: radial
        size: "64% 40%"
        at: "50% 34%"
        stops:
          - color: "rgba(255, 255, 255, .22)"
          - color: "rgba(255, 255, 255, 0)"
            at: "74%"
      - kind: radial
        size: "circle 3.2px"
        at: "22% 78%"
        stops:
          - color: "rgba(255, 255, 255, .9)"
            at: "0 26%"
          - color: "rgba(255, 255, 255, 0)"
            at: "100%"
      - kind: radial
        size: "circle 2.2px"
        at: "74% 22%"
        stops:
          - color: "rgba(255, 255, 255, .75)"
            at: "0 26%"
          - color: "rgba(255, 255, 255, 0)"
            at: "100%"
      - kind: radial
        size: "circle 2.6px"
        at: "62% 64%"
        stops:
          - color: "rgba(255, 255, 255, .65)"
            at: "0 26%"
          - color: "rgba(255, 255, 255, 0)"
            at: "100%"
      - kind: token
        ref: "--grain-fine"
    threeD:
      foil: "0.72"
      scale: "4.6"
      tint: "[1.00, 0.97, 1.00]"
      spec: "0.50"
      relief: "1.00"
      sparkle: "1.30"
      edge: "[0.95, 0.93, 0.88]"

  # ---------------------------------------------------------------- deckStyleInk

  # ---------------------------------------------------------------- deckStyleSilver
  silver:
    labelKey: "deckStyleSilver"
    reliefPattern:            # 与烫金同一套结构，见 goldfoil 那条（2026-09-25）
      kind: vine
      amp: 0.09
    tier: "advanced"
    note: "烫银：与烫金是**同一套结构**（两条高光 + 拉丝 + 压深四边），只把色相换到冷端。3D 侧的缠枝卷草与烫金同参数（见 goldfoil 那条，2026-09-25）。"
    fretLine: "#eaf0f8"
    gemColor: "#d6e4f2"
    finish:
      kind: linear
      direction: "140deg"
      stops:
        - color: "rgba(250, 253, 255, .56)"
        - color: "rgba(196, 210, 226, .30)"
          at: "16%"
        - color: "rgba(140, 158, 178, .32)"
          at: "32%"
        - color: "rgba(246, 251, 255, .50)"
          at: "50%"
        - color: "rgba(126, 144, 164, .30)"
          at: "66%"
        - color: "rgba(104, 122, 142, .30)"
          at: "84%"
        - color: "rgba(240, 248, 255, .44)"
    plate:
      kind: linear
      direction: "to top"
      stops:
        - color: "rgba(14, 20, 28, .93)"
        - color: "rgba(14, 20, 28, .62)"
    plateSolid: "rgba(14, 20, 28, .88)"
    plateText: "#eef4fb"
    plateAccent: "#cfe0f0"
    blend: "overlay"
    opacity: ".95"
    filter: "url(#deck-rough)"
    print:
      - kind: linear
        direction: "112deg"
        stops:
          - color: "rgba(240, 248, 255, 0)"
            at: "40%"
          - color: "rgba(226, 240, 255, .24)"
            at: "45.5%"
          - color: "rgba(255, 255, 255, .60)"
            at: "48.5%"
          - color: "rgba(226, 240, 255, .22)"
            at: "51.5%"
          - color: "rgba(240, 248, 255, 0)"
            at: "58%"
      - kind: linear
        direction: "112deg"
        stops:
          - color: "rgba(226, 240, 255, 0)"
            at: "63%"
          - color: "rgba(246, 252, 255, .28)"
            at: "66%"
          - color: "rgba(226, 240, 255, 0)"
            at: "70%"
      - kind: repeating-linear
        direction: "96deg"
        stops:
          - color: "rgba(226, 240, 255, 0)"
            at: "0 1.7px"
          - color: "rgba(226, 240, 255, .24)"
            at: "2.5px 3.4px"
          - color: "rgba(40, 56, 74, .20)"
            at: "4.6px 5.5px"
          - color: "rgba(226, 240, 255, 0)"
            at: "6.7px 9.4px"
      - kind: radial
        size: "126% 96%"
        at: "50% 46%"
        stops:
          - color: "rgba(20, 34, 48, 0)"
            at: "46%"
          - color: "rgba(12, 22, 34, .40)"
            at: "100%"
      - kind: token
        ref: "--grain-fine"
    threeD:
      foil: "0.38"
      scale: "1.6"
      tint: "[0.94, 0.96, 1.00]"
      spec: "0.95"
      relief: "0.95"
      sparkle: "0.90"
      edge: "[0.88, 0.91, 0.95]"

  # ---------------------------------------------------------------- deckStyleStarnight

  # ---------------------------------------------------------------- deckStyleStarnight
  starnight:
    labelKey: "deckStyleStarnight"
    reliefPattern:            # 工艺纹样进浮雕高度图（2026-09-25）：星屑夜天·星点
      kind: starfield  # 主体遮罩改阈值化后重开（2026-09-25）：人物主体压到 6%，背景/边框留全强度
      amp: 0.07  # 峰值抬升
    tier: "basic"
    note: "星屑夜天：深蓝紫的框 + 一层疏密不匀的星点与流星痕。"
    fretLine: "rgba(206, 216, 255, .90)"
    finish:
      kind: linear
      direction: "140deg"
      stops:
        - color: "rgba(96, 116, 200, .34)"
        - color: "rgba(28, 26, 62, .46)"
          at: "52%"
        - color: "rgba(72, 88, 168, .32)"
    plate:
      kind: linear
      direction: "to top"
      stops:
        - color: "rgba(10, 12, 30, .94)"
        - color: "rgba(10, 12, 30, .7)"
    plateSolid: "rgba(10, 12, 30, .9)"
    plateText: "#eceafd"
    plateAccent: "#b9c4ff"
    blend: "normal"
    opacity: ".55"
    mask:
      - kind: token
        ref: "--tex-starfield"
    maskSize: "100% 100%"
    maskRepeat: "no-repeat"
    filter: "none"
    print:
      - kind: linear
        direction: "160deg"
        stops:
          - color: "rgba(30, 34, 88, .42)"
          - color: "rgba(18, 16, 44, .30)"
            at: "55%"
          - color: "rgba(26, 30, 76, .40)"
      - kind: token
        ref: "--grain-fine"
    threeD:
      foil: "0.26"
      scale: "3.4"
      tint: "[0.78, 0.84, 1.00]"
      spec: "0.45"
      relief: "1.00"
      sparkle: "1.45"
      edge: "[0.30, 0.34, 0.66]"

  # ---------------------------------------------------------------- deckStyleWashi

  # ================================================================ 印刷系（2026-09-24 新做的四种）
  # 依据 brief §十六 的适配表：凸印与珠光只/主要在亮卡上好看，烫金与墨染在暗卡上是主场
  # （烫金在亮中也可用）。这条信息与 scripts/deck-edit.py 的 CRAFT_RULE 必须一致。

  # ---------------------------------------------------------------- deckStyleEmboss
  emboss:
    labelKey: "deckStyleEmboss"
    reliefPattern:            # 工艺纹样进浮雕高度图（2026-09-25）
      kind: lattice   # 45° 硬菱格（压痕靠脆边界读出来）
      amp: 0.08
    tier: "basic"
    note: "凸印压痕（emboss）：**纸白压印，只改光不改色** —— 左上受光、右下落影，再给主体一圈接触阴影。那圈阴影是它与珠光纸在 205px 下分得开的那一笔（brief §八「两者的视觉签名在小尺寸下要不同」）。深度图派生的受力图**已接进来**（2026-09-25）：`tools/cards/make-emboss.py` 由深度图算高度场梯度出两张灰图（受光走 soft-light、脊线镜面走 screen），挂在 `.home-card-bump` / `::after` 上，见 21-card-deck.css；下面 print 里那两条 135deg 的光影**保留**（它们是整张的朝向感，与沿起伏走的受力图不是一回事）。"
    fretLine: "rgba(247, 243, 235, .92)"
    gemColor: "#e6e0d2"
    finish:
      kind: linear
      direction: "140deg"
      stops:
        - color: "rgba(250, 248, 243, .40)"
        - color: "rgba(226, 220, 208, .22)"
          at: "52%"
        - color: "rgba(255, 253, 248, .34)"
    plate:
      kind: linear
      direction: "to top"
      stops:
        - color: "rgba(56, 52, 45, .92)"
        - color: "rgba(56, 52, 45, .62)"
    plateSolid: "rgba(56, 52, 45, .88)"
    plateText: "#f8f4ea"
    plateAccent: "#cec5b2"
    blend: "soft-light"
    opacity: "1"
    filter: "url(#deck-rough)"
    print:
      - kind: linear
        direction: "135deg"
        stops:
          - color: "rgba(255, 255, 255, .46)"
            at: "0%"
          - color: "rgba(255, 255, 255, 0)"
            at: "54%"
      - kind: linear
        direction: "135deg"
        stops:
          - color: "rgba(0, 0, 0, 0)"
            at: "46%"
          - color: "rgba(0, 0, 0, .40)"
            at: "100%"
      - kind: radial
        size: "128% 98%"
        at: "50% 46%"
        stops:
          - color: "rgba(24, 18, 10, 0)"
            at: "52%"
          - color: "rgba(24, 18, 10, .30)"
            at: "100%"
      - kind: radial
        size: "120% 92%"
        at: "36% 30%"
        stops:
          - color: "rgba(255, 255, 255, .30)"
          - color: "rgba(255, 255, 255, 0)"
            at: "58%"
      - kind: token
        ref: "--grain"
    threeD:
      foil: "0.08"
      scale: "1.2"
      tint: "[1.00, 0.99, 0.96]"
      spec: "0.30"
      relief: "1.30"
      sparkle: "0.30"
      edge: "[0.93, 0.91, 0.87]"

  # ---------------------------------------------------------------- deckStylePearl
  pearl:
    labelKey: "deckStylePearl"
    reliefPattern:            # 工艺纹样进浮雕高度图（2026-09-25）
      kind: laid      # 帘纹（纸纹要细密、幅度低）
      amp: 0.08
    tier: "basic"
    note: "珠光纸（pearl）：暖白底 + **各向异性**的细密丝光（只朝一个方向，不是织布）+ 一道宽而柔的珠光扫光 + 纸纹颗粒。整体**偏暖** —— 这正是它在 205px 下与凸印压痕分得开的那一笔（brief §八）。"
    fretLine: "rgba(252, 246, 234, .92)"
    gemColor: "#f2e2c6"
    finish:
      kind: linear
      direction: "140deg"
      stops:
        - color: "rgba(255, 251, 243, .46)"
        - color: "rgba(238, 222, 196, .26)"
          at: "52%"
        - color: "rgba(255, 248, 236, .40)"
    plate:
      kind: linear
      direction: "to top"
      stops:
        - color: "rgba(46, 38, 28, .92)"
        - color: "rgba(46, 38, 28, .62)"
    plateSolid: "rgba(46, 38, 28, .88)"
    plateText: "#fdf7ec"
    plateAccent: "#e6cfa8"
    blend: "soft-light"
    opacity: "1"
    filter: "none"
    print:
      - kind: linear
        direction: "108deg"
        stops:
          - color: "rgba(255, 246, 228, 0)"
            at: "22%"
          - color: "rgba(255, 246, 230, .26)"
            at: "44%"
          - color: "rgba(255, 252, 244, .34)"
            at: "52%"
          - color: "rgba(248, 232, 206, .22)"
            at: "62%"
          - color: "rgba(255, 246, 228, 0)"
            at: "80%"
      - kind: repeating-linear
        direction: "92deg"
        stops:
          - color: "rgba(255, 248, 236, 0)"
            at: "0 2.4px"
          - color: "rgba(255, 246, 228, .13)"
            at: "3.1px 4.2px"
          - color: "rgba(214, 190, 158, .10)"
