        ref: "--grain-fine"
    threeD:
      foil: "0.34"
      scale: "1.5"
      tint: "[1.00, 0.84, 0.45]"
      spec: "0.90"
      relief: "0.90"
      sparkle: "1.00"
      edge: "[0.90, 0.75, 0.40]"

  # ---------------------------------------------------------------- deckStyleHoloPrism
  holo-prism:
    labelKey: "deckStyleHoloPrism"
    tier: "advanced"
    note: "星芒全息（holo-prism）：以画面上方三分之一处为中心的**放射虹彩** + 几颗星点 + 大扫光。"
    fretLine: "linear-gradient(100deg, #ffd9a0, #ff9ec4 28%, #a0e8ff 52%, #c9a0ff 76%, #ffe6b0)"
    gemColor: "#d9c9ff"
    finish:
      kind: linear
