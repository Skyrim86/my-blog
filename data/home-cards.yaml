# 首页卡片组的清单 —— **单一事实源**：生成脚本（tools/cards/make-cards.py）按它出卡面，
# 模板（layouts/_partials/home-cards.html）按它渲染卡面、名牌与风格。改卡片只改这个文件。
#
# 字段：
#   image   产物路径（**相对 assets/**，即 images/cards/xxx.webp；生成产物、不要手改）
#   src     源图路径（仓库根相对）
#   crop    取景：figure = **整幅人像装进卡面**（默认，2026-09-19 起；先按内容包围盒定窗，
#           装不下就把整幅缩进卡面、四周用源图四角的底色补边）；auto = 按内容包围盒填满卡面
#           （会切人，只在源图本身就是特写时用）；[x0,y0,x1,y1] = 分数窗手量
#   pad     figure 取景的余量（默认 1.16；想让画面更满就调小、想多留底色就调大）
#   flat    垫底渐变（[上, 下] 两个 RGB）：给透明源图，或 figure 取景装不下时手定底色；
#           不写则用源图四角的实测底色
#   series  系列名；name = 这张卡自己的名字（名牌显示 name + 系列副标）
#   style   卡面风格（**现役八种**，全是 CSS 画的，不烘进图里）。写的是代码名，分两档：
#             · 普通工艺（纸面 + 单层印纹，5 种）：foil 全息 / starnight 星屑 /
#               emboss 凸印压痕 / pearl 珠光纸 / inkwash 墨染
#             · 进阶工艺（多层材料，3 种）：holo-prism 星芒全息 / silver 烫银 / goldfoil 烫金箔
#           2026-09-24 从**十六种收敛到八种**（用户拍定，依据 docs/card-redesign-brief.md 的
#           §八 样张实测 / §十六 工艺 × 卡面适配表 / §十八 三档规则）：保留四种光系，新做四种
#           印刷系，汰掉的十种逐张并入 —— 映射见本文件下面那段组注释。
#           加一种工艺要同时动五处：这个清单、data/card-styles.yaml（参数表 —— 跑
#           node tools/cards/render-styles.mjs --write 出 21-card-styles.css 与 card-3d.js 的
#           STYLE_3D）、assets/css/decks/21-card-deck.css 里那种工艺的结构件（伪元素 / 后代 /
#           深色覆写，只有玻璃与金继有）、i18n 的 deckStyle<名>、以及 deck-manifest.html 里的
#           styleLabel 与 $styleTier 两张表 —— check-deck.mjs 的守卫会逐条核，漏一处就报
#           （漏 STYLE_3D 的那种最阴：首页看着是烫金箔、转起来是普通全息，两种视图永远不同屏）。
#           分档口径取「能从代码里数出来」的那个（普通只有一层、进阶要多层叠加）。
#           **两档是纯分类口径**：它不管边框（边框归等级 —— 带宽 / 角饰 / 淡入都由
#           .home-card-rank--* 给），也不管那副「雕花框」显不显形（那也看等级，秘藏及以上才显）。
#           它驱动的是**收藏库筛选条的分组**：普通 / 进阶两个子排 + 可点的组标签。
#           **哪一种算哪一档的唯一定义处是 layouts/_partials/deck-manifest.html 的 $styleTier 表**，
#           这里只是同一份口径的说明。
#           **工艺 × 卡面明度**（brief §十八）：亮 ≥185 / 中 140~185 / 暗 <140 三档各有一个
#           「允许工艺」集合，规则的**唯一一份实现**是 scripts/deck-edit.py 的 CRAFT_RULE
#           （管理页的收藏库面板与 check-deck.mjs 的守卫都从那里读）；明度由脚本**现算**、
#           不写死进本文件（换图后自动重算）。要破例就写 `craft_exempt: true`，守卫放行但会打出来。
#           **写错会静默退回兜底的 foil** —— scripts/check-deck.mjs 会拿 CSS 里的类名核出来。
#           注意风格**只管纹样与质感**：框的材料由等级定（六档色阶），所以「烫金箔」这个风格名
#           在收藏档看到的是灰框 + 一层金质感的叠层，不是金框。两轴的分工见 rank 那一段。
#   rank    等级（**必填**，漏了会静默变收藏 —— 所以 check-deck.mjs 会拦）。
#           **六档**（2026-09-21 从四档扩到六档，加了 rare 珍稀 / arcane 秘藏），从低到高：
#             collector 收藏 / rare 珍稀 / epic 史诗 / arcane 秘藏 / legend 传世 / miracle 奇迹（隐藏）
#           等级管**材料与档位**（框的材质底色 = 六档色阶、框宽、画面内缩、工艺强度、徽章形状），
#           风格管**纹样与质感**，两轴正交；观感由卡面令牌与 3D 卡边按等级切换。见
#           assets/css/decks/21-card-deck.css 的「等级」一节与 docs/features.md 的六档阶梯那一节。
#           当前分布（check-deck.mjs 每次会打印一遍）：收藏 24 / 珍稀 13 / 史诗 11 / 秘藏 8 /
#           传世 6 / 奇迹 1 = 63。
#           2026-09-20 首版四档**按可量化的依据**定级：卡面细节量（文件字节 + 画面梯度）+ 源图分辨率，
#           刻意不含「角色人气」这类主观项。2026-09-21 加两档时沿用同一口径 —— 定级脚本是
#           **scripts/rank-deck.py**（可复跑、幂等，`--check` 看清单与建议的差异、`--apply` 写回；
#           分数表落在 data/rank-scores.json）。切法：只在原档内部按分数切（收藏 37 → 收藏/珍稀，
#           史诗 19 → 史诗/秘藏），传世 6 与奇迹 1 不动。
#           想调某一张就改它那一行 rank —— 脚本的 `--check` 会把差异列出来，不会覆盖你的手改。
#   credit_url  出处的**可点链接**（可选）：卡片弹层（看大图）里显示成外链，没有就只显示文字。
#           能推导的都补上了（pixiv → /artworks/<id>、safebooru → post&id=<id>、twitter/wallhaven
#           同理）；**官方立绘与站点自己的看板娘没有可点的出处**，那两张就留空 —— 别硬编一个主页
#           链接上去，那等于指错地方。

# ---- 2026-09-24 工艺收敛：十六 → 八，逐张映射（**只改 style，不动 rank、不重出图**）----
# 依据 brief §八 / §十六 / §十八：每张卡按**观感方向**并到最近的保留项，且必须落在它明度档的
# 允许集合里（三档规则见 scripts/deck-edit.py 的 CRAFT_RULE，check-deck.mjs 的守卫会核）。
# 括号里是卡面明度（brief §十八 的现算值，换图后会变）。
#
# 旧工艺 → 新工艺（卡名）：
#   全息 foil（不变）：甲刃、夏荫、星眸、朱领
#   星芒全息 holo-prism（不变）：绯光、电波、琉璃音
#   烫银 silver（不变）：猫兜、春眠、云梦
#   星屑 starnight（不变）：夜间
#   星屑 starnight → 星芒全息：观星（180）、夜思（146）
#   玻璃 glass → 珠光纸 pearl：木刀、闲坐、流水、花冠
#   和纸 washi → 珠光纸 pearl：书案、蝶羽、晨食
#   珍珠母贝 nacre → 珠光纸 pearl：白鹭、惊鸿、桃夭
#   绸缎 silk → 珠光纸 pearl：樱琴、白露
#   冰裂 frostcrack → 烫银 silver：霜华、雪舞、糖霜、初醒、青萝、玫露
#   雪华 yukika → 凸印压痕 emboss：日间、霓裳、轻絮、寒蕊、花织
#   墨 ink → 凸印压痕 emboss：墨羽、玄袖
#   墨 ink → 墨染 inkwash：夜宴
#   金边 gold → 烫金箔 goldfoil：大小姐、女侍、蝶澜、墨褶
#   雕花金 filigree → 烫金箔 goldfoil：花簪；→ 星屑 starnight：星夜（127）；→ 墨染 inkwash：夜翎（97）
#   珐琅彩 enamel → 烫金箔 goldfoil：花礼、紫绫、嫁衣、初始之音、旋律
#   金继 kintsugi → 烫金箔 goldfoil：独奏（173）、狐耳（221）；→ 墨染 inkwash：提灯（92）
#   极光 aurora → 星芒全息 holo-prism：待发（78）；→ 星屑 starnight：雨幕（64）；→ 全息 foil：芳辰（217）
#
# 五处不是「同一族原样搬过去」、而是**按明度档退到最近的允许项**（记下来，别当成写错）：
#   · 墨：它本身该并进墨染，但墨染只适合暗卡面（亮卡上读成漏墨，brief §十六）；玄袖（208）与
#     墨羽（164）是亮/中卡面，退到凸印压痕 —— 同属「只改光不改色」的哑光纸感。
#   · 雕花金：长着细金线的那张（花簪 200）并进烫金箔；夜翎（97）与星夜（127）都并进暗档里更贴
#     画面的那个（墨染 / 星屑）。
#   · 金继 = 黑底 + 金缝，拆成两半：金缝那半给烫金箔（独奏 173、狐耳 221），黑底那半给墨染（提灯 92）。
#   · 极光：光带 → 星芒全息（待发 78）；雨幕（64）给星屑 —— 它 2026-09-21 之前本来就是星屑，
#     而流星痕与雨幕同形；芳辰（217）是亮卡，星芒全息不在亮档的集合里，退到全息。
#   · 星屑（保留项）原有 3 张，其中观星（180）与夜思（146）是**中档卡面**，而星屑只适合暗卡 ——
#     这正是 brief §十八 体检里那两张违规：改成星芒全息（同族、中档允许），违规归零。
#
# 改后八种的张数（每种 ≥3，最多种 12）：pearl 12 / goldfoil 12 / silver 9 / emboss 7 /
#   holo-prism 6 / foil 5 / starnight 3 / inkwash 3 = 57。
#       starnight 5 / ink 3 / holo-prism 3 / kintsugi 3 / filigree 3

