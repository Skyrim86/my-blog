# 首页卡片组的清单 —— **单一事实源**：生成脚本（tools/cards/make-cards.py）按它出卡面，
# 模板（layouts/_partials/home-cards.html）按它渲染卡面、名牌与风格。改卡片只改这个文件。
#
# 字段：
#   image   产物路径（**相对 assets/**，即 images/cards/xxx.webp；生成产物、不要手改）
#   src     源图路径（仓库根相对）
#   crop    取景：figure = **整幅人像装进卡面**（默认，2026-09-19 起；先按内容包围盒定窗，
#           装不下就把整幅缩进卡面、四周用源图四角的底色补边）；auto = 按内容包围盒填满卡面
#           （会切人，只在源图本身就是特写时用）；[x0,y0,x1,y1] = 分数窗手量
#   pad     figure 取景的余量（默认 1.16；想让画面更满就调小、想多留底色就调大）
#   flat    垫底渐变（[上, 下] 两个 RGB）：给透明源图，或 figure 取景装不下时手定底色；
#           不写则用源图四角的实测底色
#   series  系列名；name = 这张卡自己的名字（名牌显示 name + 系列副标）
#   style   卡面风格（**现役十六种**，全是 CSS 画的，不烘进图里）。写的是代码名，分两档：
#             · 普通工艺（纸面 + 单层印纹，8 种）：
#               foil 全息 / washi 和纸 / ink 墨 / yukika 雪华 / starnight 星屑 / frostcrack 冰裂 /
#               nacre 珍珠母贝 / silk 绸缎
#             · 进阶工艺（多层材料，8 种）：
#               holo-prism 星芒全息 / glass 玻璃 / gold 金边 / kintsugi 金继 /
#               filigree 雕花金 / enamel 珐琅彩 / silver 烫银 / aurora 极光
#           2026-09-21 加了后四种（珍珠母贝 / 绸缎 / 烫银 / 极光），十二 → 十六种。
#           加一种工艺要同时动五处：这个清单、assets/css/decks/21-card-deck.css 的
#           `.home-card--<名>` 块、assets/js/card-3d.js 的 STYLE_3D、i18n 的 deckStyle<名>、
#           以及 deck-manifest.html 里的 styleLabel 与 $styleTier 两张表 —— check-deck.mjs
#           的守卫会逐条核，漏一处就报（漏 STYLE_3D 的那种最阴：首页看着是雕花金、
#           转起来是普通全息，两种视图永远不同屏）。
#           分档口径取「能从代码里数出来」的那个（普通只有一层、进阶要多层叠加）。
#           **两档是纯分类口径**：它不管边框（边框归等级 —— 带宽 / 角饰 / 淡入都由
#           .home-card-rank--* 给），也不管那副「雕花框」显不显形（那也看等级，秘藏及以上才显）。
#           它驱动的是**收藏库筛选条的分组**：普通 / 进阶两个子排 + 可点的组标签。
#           **哪一种算哪一档的唯一定义处是 layouts/_partials/deck-manifest.html 的 $styleTier 表**，
#           这里只是同一份口径的说明 —— 2026-09-21 之前这里漏了 frostcrack（它只在别处的注释里
#           被写成「普通」），页面上一点看不出来，是 check-deck.mjs 的守卫数出来的。
#           **filigree / enamel / starnight / frostcrack 是 2026-09-21 新加的**，当天就按
#           「名字与气质对得上」分给了 18 张卡（**只改 style、不动 rank**，所以六档分布没变）：
#           冰裂 6 张（霜华/雪舞/糖霜/雪原/冰纹/雪松）、星屑 5 张（夜间/夜行/猎星/月影/雨幕）、
#           雕花金 4 张（花信/星夜/银霜/电波，原先是金继）、珐琅彩 3 张（初始之音/旋律/琉璃音）。
#           2026-09-20 从十六种精简而来（十六种里其实只有四个原子配方，同一配方的变体在
#           272px 下看不出差别，而每多一种就多一份明暗两套的维护面；CSS 因此从 67 KB 降到 54 KB）。
#           被砍的按族挪到最接近的保留项：holo-gold→foil（同构，只差色相）、frost/sakura→yukika、
#           gothic→kintsugi、asanoha/uchiwa→washi、seigaiha→glass、nishiki→gold，pixel 直接删除。
#           理由与被砍清单见 docs/features.md ㊵。
#           **写错会静默退回兜底的 foil** —— scripts/check-deck.mjs 会拿 CSS 里的类名核出来。
#           注意风格**只管纹样与质感**：框的材料由等级定（六档色阶），所以「金边」这个风格名
#           在收藏档看到的是灰框 + 一层金质感的叠层，不是金框。两轴的分工见 rank 那一段。
#   rank    等级（**必填**，漏了会静默变收藏 —— 所以 check-deck.mjs 会拦）。
#           **六档**（2026-09-21 从四档扩到六档，加了 rare 珍稀 / arcane 秘藏），从低到高：
#             collector 收藏 / rare 珍稀 / epic 史诗 / arcane 秘藏 / legend 传世 / miracle 奇迹（隐藏）
#           等级管**材料与档位**（框的材质底色 = 六档色阶、框宽、画面内缩、工艺强度、徽章形状），
#           风格管**纹样与质感**，两轴正交；观感由卡面令牌与 3D 卡边按等级切换。见
#           assets/css/decks/21-card-deck.css 的「等级」一节与 docs/features.md 的六档阶梯那一节。
#           当前分布（check-deck.mjs 每次会打印一遍）：收藏 24 / 珍稀 13 / 史诗 11 / 秘藏 8 /
#           传世 6 / 奇迹 1 = 63。
#           2026-09-20 首版四档**按可量化的依据**定级：卡面细节量（文件字节 + 画面梯度）+ 源图分辨率，
#           刻意不含「角色人气」这类主观项。2026-09-21 加两档时沿用同一口径 —— 定级脚本是
#           **scripts/rank-deck.py**（可复跑、幂等，`--check` 看清单与建议的差异、`--apply` 写回；
#           分数表落在 data/rank-scores.json）。切法：只在原档内部按分数切（收藏 37 → 收藏/珍稀，
#           史诗 19 → 史诗/秘藏），传世 6 与奇迹 1 不动。
#           想调某一张就改它那一行 rank —— 脚本的 `--check` 会把差异列出来，不会覆盖你的手改。
#   credit_url  出处的**可点链接**（可选）：卡片弹层（看大图）里显示成外链，没有就只显示文字。
#           能推导的都补上了（pixiv → /artworks/<id>、safebooru → post&id=<id>、twitter/wallhaven
#           同理）；**官方立绘与站点自己的看板娘没有可点的出处**，那两张就留空 —— 别硬编一个主页
#           链接上去，那等于指错地方。

# ---- 2026-09-21 工艺再分配：**每种工艺至少 3 张**，单种最多 8 ----
# 为什么要动：旧分配是「金边 14 / 和纸 13」对「墨 1 / 星芒全息 1」——而收藏库（/collection/）
# 那面墙存在的理由就是「一眼看出这八张不是同一种卡」，分布偏成那样这条理由就不成立。
# **只改 style、不动 rank、不重出图**（工艺全是 CSS 画的，见下面那段说明），零成本重排。
# 口径：名字与气质对得上 —— 玄袖/夜宴 → 墨，银铃/银绢/银纱/银月 → 全息，
#   樱簪/花冠/花礼/冰晶 → 珐琅彩，幽兰 → 金继，电波/琉璃音 → 星芒全息，
#   薄冰/静水/冰凌 → 玻璃，霜羽/雪羽 → 雪华，雪铃 → 冰裂。
# 改前：gold 14 / washi 13 / glass 6 / frostcrack 6 / yukika 6 / starnight 5 /
#       filigree 4 / enamel 3 / foil 2 / kintsugi 2 / ink 1 / holo-prism 1
# 改后：glass 8 / frostcrack 7 / yukika 7 / enamel 6 / foil 6 / gold 6 / washi 6 /
#       starnight 5 / ink 3 / holo-prism 3 / kintsugi 3 / filigree 3

