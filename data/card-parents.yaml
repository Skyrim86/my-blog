# 卡片的主次关系：**附属结论**（引理 / 推论 / 性质）挂在哪个**主卡**下面。
#
# 为什么引理得手写：这层关系是「谁用了谁」，而正文里查不到 —— 数学卡正文里那 48 处交叉引用
# 全是引「工具卡」（定义/命题那一类），没有一处引引理。引理是公用的工具，通常一条服务好几个
# 定理，所以只能逐条点明白（笔记里的依据抄在 why 里，下次改不用重读笔记）。
#
# 字段：
#   card  附属结论的卡片 id
#   onto  主卡的 id 列表 —— 可以多个：公用的东西就都挂上，每个用到它的主卡下面都会出现
#         （同一面墙上会出现好几份，第二份起在页面上画淡一些，见 docs/features.md ㉑）
#   why   这么挂的依据
#
# 规则（**没写在这里的卡**由脚本按编号推，见 docs/content.md §10）：
#   推论 → 挂同一节里排在它前面、最近的那个定理/命题
#   性质 → 挂同一节里排在它前面的最近的那个定义/概念（性质是「某个东西的性质」）
#   引理 → 同样退回「前面最近的定理/命题」，但引理往往一条挂好几家，所以三张都写在这儿
# 写空列表 = 明确不挂。
#
# 两条硬规矩（scripts/check-cards.mjs 会查）：
#   ① 只挂**主卡**，不给附属结论再挂附属结论（否则墙面变成三层缩进）；
#   ② 被挂的 id 必须真实存在、不能自指、不能成环。
#
# 反过来的信息也记一笔：推论 6.2（均值与斜率估计不相关）的推导引用了引理 4.1 给出的 (4.2)，
# 但它本身是附属结论，按规矩①不挂到引理下面。
parents:
  - card: thm-4-1
    onto: [thm-4-2, thm-4-3, thm-4-4, thm-4-5]
    why: '引理 4.1（系数表示与正交性）给出的 (4.1)/(4.2) 两组关系，被定理 4.2、4.3、4.4、4.5 的证明各自引用（笔记里逐条标了「用 (4.2)」「由 (4.1)」）。命题 4.6 用的是 Fisher 信息，不引用它，不挂。'
  - card: thm-5-2
    onto: [thm-5-3]
    why: '定理 5.3（σ̂² 无偏）的证明「在 (5.3) 两边取期望」「代入 (5.3)」——(5.3) 正是引理 5.2 的结论。定理 5.4（残差平方和的分布与独立性）走的是投影语言，不引用它，不挂。'
  - card: thm-8-3
    onto: [thm-8-5, thm-8-8]
    why: '定理 8.5（分布）与命题 8.8（与 t 检验的等价性）的证明都标了「用 (8.2)」——(8.2) 是引理 8.3 的结论。定理 8.9（均方的期望）虽然也用 β̂₁²S_xx，但笔记里没标引用，不挂。'
